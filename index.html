   --------------------------------------------------------------------- */
async function generateDemoTrades() {
  if (!ACCOUNTS.length) {
    const demoAcc = blankAccount({ name: "Demo Account", accountSize: 100000, startingBalance: 100000, maxDrawdown: 3000, defaultInstrument: "NQ" });
    await saveAccount(demoAcc);
  }
  const accId = getActiveAccounts()[0].id;
  const models = activeBiasModels();
  const sessions = activeTriggerSessions();
  const pois = activePOIOptions();
  const tfs = activeTFOptions();
  const scns = activeScenarios();
  const sessionNames = ["Asia", "London", "New York"];
  const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const demoTrades = [];
  const today = new Date();
  for (let i = 0; i < 40; i++) {
    const t = blankTrade();
    const d = new Date(today); d.setDate(d.getDate() - (40 - i));
    t.accountId = accId;
    t.date = d.toISOString().slice(0, 10);
    t.time = String(6 + (i % 8)).padStart(2, "0") + ":30";
    t.session = rand(sessionNames);
    t.instrument = "NQ";
    t.direction = rand(["Long", "Short"]);
    t.marketContext.marketCondition = rand(MARKET_CONDITIONS);

    const model = rand(models);
    if (model) {
      t.framework.biasModelId = model.id;
      t.framework.biasName = model.name;
      t.framework.bias = model.name;
      t.framework.confirmationTitle = model.name;
      t.marketContext.dailyBias = model.name;
      enabledChecklist(model).forEach(c => { t.framework.confirmationChecks[c.id] = Math.random() > 0.2; });
    }
    const sess = rand(sessions);
    if (sess) {
      t.framework.triggerSessionId = sess.id;
      t.framework.triggerName = sess.name;
      t.framework.trigger = sess.name;
      enabledChecklist(sess).forEach(c => { t.framework.triggerChecks[c.id] = Math.random() > 0.2; });
    }
    // C2 Intraday (multi-select POI + single TF/scenario)
    const nP = 1 + Math.floor(Math.random() * 2);
    const chosen = [];
    for (let k = 0; k < nP && pois.length; k++) { const p = rand(pois); if (!chosen.includes(p.id)) chosen.push(p.id); }
    t.c2Intraday.whichPOI = chosen;
    if (tfs.length) t.c2Intraday.whichTF = rand(tfs).id;
    if (scns.length) t.c2Intraday.scenario = rand(scns).id;

    const risk = 200;
    t.execution.entry = (15000 + Math.random() * 500).toFixed(2);
    t.execution.stopLoss = (Number(t.execution.entry) - 20).toFixed(2);
    t.execution.target = (Number(t.execution.entry) + 40).toFixed(2);
    t.execution.contracts = 2;
    t.execution.pointValue = 5;
    t.execution.risk = risk;
    const rr = Math.random();
    const finalR = rr > 0.45 ? (1 + Math.random() * 2) : -(0.6 + Math.random() * 0.6);
    t.management.finalR = finalR.toFixed(2);
    t.management.finalPnL = (finalR * risk).toFixed(2);
    t.management.exitType = finalR > 0 ? "TP" : "SL";
    t.executionReview.contextScore = 12 + Math.floor(Math.random() * 8);
    t.executionReview.frameworkScore = 12 + Math.floor(Math.random() * 8);
    t.executionReview.entryScore = 12 + Math.floor(Math.random() * 8);
    t.executionReview.riskScore = 12 + Math.floor(Math.random() * 8);
    t.executionReview.managementScore = 12 + Math.floor(Math.random() * 8);
    t.executionReview.ruleBreak = Math.random() > 0.85 ? "YES" : "NO";
    t.review.followedPlan = Math.random() > 0.2;
    t.review.validSetup = Math.random() > 0.25;
    t.entryExecutionStyle = rand(["Aggressive", "Conservative", null]);
    t.isDemo = true;
    deriveTrade(t);
    demoTrades.push(t);
  }
  for (const t of demoTrades) { await idbPut("trades", t); TRADES.push(t); }
  toast("Demo data generated (40 trades).");
}

// Ensure a trade object has all current fields (in memory only — never rewrites
// legacy trade data on disk unless the trade is subsequently saved by the user).
// Adds new containers with safe defaults so old trades render without errors.
function migrateTradeShape(t) {
  if (!t.framework) t.framework = {};
  if (t.framework.biasModelId === undefined) t.framework.biasModelId = "";
  if (t.framework.triggerSessionId === undefined) t.framework.triggerSessionId = "";
  if (!t.framework.confirmationChecks) t.framework.confirmationChecks = {};
  if (!t.framework.triggerChecks) t.framework.triggerChecks = {};
  if (t.framework.biasName === undefined) t.framework.biasName = t.framework.bias || "";
  if (t.framework.triggerName === undefined) t.framework.triggerName = t.framework.trigger || "";
  if (t.framework.bias === undefined) t.framework.bias = "";
  if (t.framework.confirmationTitle === undefined) t.framework.confirmationTitle = "";
  if (t.framework.trigger === undefined) t.framework.trigger = "";
  if (t.frameworkVersionId === undefined) t.frameworkVersionId = null; // legacy marker
  if (!t.c2Intraday) t.c2Intraday = { whichPOI: [], whichTF: "", scenario: "" };
  if (!Array.isArray(t.c2Intraday.whichPOI)) {
    // Defensive: if an old export stored a comma string, split it back to an array.
    if (typeof t.c2Intraday.whichPOI === "string" && t.c2Intraday.whichPOI) {
      t.c2Intraday.whichPOI = t.c2Intraday.whichPOI.split(",").map(s => s.trim()).filter(Boolean);
    } else {
      t.c2Intraday.whichPOI = [];
    }
  }
  if (t.c2Intraday.whichTF === undefined) t.c2Intraday.whichTF = "";
  if (t.c2Intraday.scenario === undefined) t.c2Intraday.scenario = "";
  if (t.entryExecutionStyle === undefined) t.entryExecutionStyle = null;
  if (!t.screenshots) t.screenshots = { before: null, entry: null, after: null };
  return t;
}

// Create the seed framework version if the framework store is empty.
// Never rewrites historical trades — legacy trades keep frameworkVersionId=null.
async function migrateFrameworkIfNeeded() {
  const stored = await idbGetAll("framework");
  FRAMEWORK_VERSIONS = stored || [];
  if (!FRAMEWORK_VERSIONS.length) {
    const v1 = makeFrameworkVersion("1.0", "published", seedFrameworkConfig());
    await idbPut("framework", v1);
    FRAMEWORK_VERSIONS = [v1];
    ACTIVE_FRAMEWORK = v1;
    SETTINGS.activeFrameworkVersionId = v1.id;
    await idbPut("kv", SETTINGS);
    return;
  }
  // Resolve active version: settings pointer -> first published -> first any.
  let active = null;
  if (SETTINGS.activeFrameworkVersionId) active = frameworkVersionById(SETTINGS.activeFrameworkVersionId);
  if (!active) active = FRAMEWORK_VERSIONS.find(v => v.status === "published");
  if (!active) active = FRAMEWORK_VERSIONS.find(v => v.status === "locked");
  if (!active) active = FRAMEWORK_VERSIONS[0];
  ACTIVE_FRAMEWORK = active || null;
  if (ACTIVE_FRAMEWORK && SETTINGS.activeFrameworkVersionId !== ACTIVE_FRAMEWORK.id) {
    SETTINGS.activeFrameworkVersionId = ACTIVE_FRAMEWORK.id;
    await idbPut("kv", SETTINGS);
  }
}

async function migrateAccountsIfNeeded() {
  // If there are trades but no accounts (legacy single-account data), create a
  // default account from settings and attach orphan trades to it.
  if (ACCOUNTS.length === 0) {
    const legacy = (SETTINGS && SETTINGS.account) ? SETTINGS.account : null;
    const acc = blankAccount({
      name: legacy && legacy.accountName ? legacy.accountName : "My Account",
      accountSize: legacy ? legacy.accountSize : 100000,
      startingBalance: legacy ? legacy.startingBalance : 100000,
      maxDrawdown: legacy ? legacy.maxDrawdown : 0,
      defaultInstrument: legacy ? legacy.defaultInstrument : "NQ"
    });
    // Only persist a default account if there is existing trade data to attach,
    // or nothing at all (fresh install still benefits from one account).
    await saveAccount(acc);
    let changed = false;
    TRADES.forEach(t => { if (!t.accountId) { t.accountId = acc.id; changed = true; } });
    if (changed) { for (const t of TRADES) await idbPut("trades", t); }
  } else {
    // Attach any orphan trades to the first active account.
    const firstAcc = getActiveAccounts()[0] || ACCOUNTS[0];
    if (firstAcc) {
      let changed = false;
      TRADES.forEach(t => { if (!t.accountId) { t.accountId = firstAcc.id; changed = true; } });
      if (changed) { for (const t of TRADES) await idbPut("trades", t); }
    }
  }
}

async function loadAllData() {
  await openDB();
  // Settings
  const storedSettings = await idbGet("kv", "settings");
  SETTINGS = storedSettings || defaultSettings();
  // Merge any newly added default keys into an older settings object.
  const defs = defaultSettings();
  for (const k of Object.keys(defs)) { if (SETTINGS[k] === undefined) SETTINGS[k] = defs[k]; }
  if (SETTINGS.riskControl === undefined) SETTINGS.riskControl = defs.riskControl;

  // Core stores
  ACCOUNTS = (await idbGetAll("accounts")) || [];
  TRADES = (await idbGetAll("trades")) || [];
  PLAYBOOKS = (await idbGetAll("playbook")) || [];
  REVIEWS = (await idbGetAll("weeklyReviews")) || [];

  // Shape-migrate trades in memory so old trades render with new fields.
  TRADES = TRADES.map(migrateTradeShape);

  // Framework config + versions (seed V1.0 if empty).
  await migrateFrameworkIfNeeded();

  // Accounts migration (legacy single-account data).
  await migrateAccountsIfNeeded();

  applyDisplaySettings();
}

function showStorageFallbackBanner() {
  if (!USE_MEMORY_FALLBACK) return;
  const main = document.getElementById("main-content");
  const banner = document.createElement("div");
  banner.className = "reminder-strip";
  banner.style.borderColor = "var(--amber)";
  banner.style.color = "var(--amber)";
  banner.textContent = "Storage note: persistent storage is unavailable in this environment, so data will not survive a page reload here. Everything works normally otherwise — export a backup to keep your data.";
  const appEl = document.getElementById("app");
  document.body.insertBefore(banner, appEl);
}

async function init() {
  try {
    await loadAllData();
  } catch (err) {
    // Last-resort: switch to memory fallback and seed a framework so the UI loads.
    USE_MEMORY_FALLBACK = true;
    SETTINGS = SETTINGS || defaultSettings();
    if (!FRAMEWORK_VERSIONS.length) {
      const v1 = makeFrameworkVersion("1.0", "published", seedFrameworkConfig());
      FRAMEWORK_VERSIONS = [v1]; ACTIVE_FRAMEWORK = v1;
    }
  }
  showStorageFallbackBanner();
  if (!location.hash) location.hash = "#/dashboard";
  router();
}

// Expose a couple of helpers for the Data tab demo button wiring.
window.__generateDemo = generateDemoTrades;

document.addEventListener("DOMContentLoaded", init);
