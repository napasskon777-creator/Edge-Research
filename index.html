<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Edge Research System — Trading Journal</title>
<style>
:root{
  --bg:#0A0D12;
  --bg-1:#0F1319;
  --bg-2:#141A22;
  --bg-3:#1B222C;
  --border:#252D38;
  --border-soft:#1C232D;
  --text:#E7EAEE;
  --text-dim:#93A0AF;
  --text-faint:#5C6774;
  --accent:#5B8CFF;
  --accent-dim:#2A3B5C;
  --green:#33D6A0;
  --green-dim:#12332B;
  --red:#FF6B6B;
  --red-dim:#3A1F22;
  --amber:#E8A94D;
  --amber-dim:#3A2E17;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 6px;
  --sidebar-w: 220px;
}
[data-theme="light"]{
  --bg:#F5F6F8;
  --bg-1:#FFFFFF;
  --bg-2:#FFFFFF;
  --bg-3:#EEF0F3;
  --border:#DCE0E6;
  --border-soft:#E7E9ED;
  --text:#141A22;
  --text-dim:#5C6774;
  --text-faint:#93A0AF;
  --accent:#3560E0;
  --accent-dim:#DCE6FF;
  --green:#0F9D6E;
  --green-dim:#DFF6EE;
  --red:#D9403F;
  --red-dim:#FBE3E2;
  --amber:#B5791A;
  --amber-dim:#FBEDD7;
}
[data-compact="1"] .card{padding:12px !important;}
[data-compact="1"] table td, [data-compact="1"] table th{padding:6px 8px !important;}
[data-compact="1"] .field{margin-bottom:8px !important;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-1);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:20px 12px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  padding:4px 10px 20px 10px;
  font-family:var(--mono);
  letter-spacing:0.2px;
}
.brand .b1{font-size:15px;font-weight:600;color:var(--text);}
.brand .b2{font-size:11px;color:var(--text-faint);margin-top:2px;}
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
.navlist a{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius);
  color:var(--text-dim);text-decoration:none;font-size:13.5px;
  border:1px solid transparent;
}
.navlist a svg{width:16px;height:16px;flex-shrink:0;opacity:0.85;}
.navlist a:hover{background:var(--bg-2);color:var(--text);}
.navlist a.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-dim);}
.sidebar-foot{margin-top:auto;padding:10px;font-size:11px;color:var(--text-faint);font-family:var(--mono);}
.bottom-nav{display:none;}
main{flex:1;min-width:0;padding:24px 28px 90px 28px;max-width:1280px;}
h1.page-title{font-size:19px;font-weight:600;margin:0 0 4px 0;}
p.page-sub{color:var(--text-dim);margin:0 0 22px 0;font-size:13px;}
.card{
  background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;
}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
.stat-card{padding:14px 16px;}
.stat-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.4px;}
.stat-value{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px;}
.stat-value.pos{color:var(--green);}
.stat-value.neg{color:var(--red);}
.section-title{font-size:13px;font-weight:600;color:var(--text-dim);margin:26px 0 10px 0;text-transform:none;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;color:var(--text-faint);font-weight:500;font-size:11.5px;
  padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-family:var(--mono);font-size:12.5px;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover td{background:var(--bg-2);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--sans);}
.badge.good-win{background:var(--green-dim);color:var(--green);}
.badge.good-loss{background:var(--accent-dim);color:var(--accent);}
.badge.bad-win{background:var(--amber-dim);color:var(--amber);}
.badge.bad-loss{background:var(--red-dim);color:var(--red);}
.badge.neutral{background:var(--bg-3);color:var(--text-dim);}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-3);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:var(--sans);
}
.btn:hover{border-color:var(--text-faint);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{background:var(--red-dim);border-color:var(--red-dim);color:var(--red);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.field .hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:var(--radius);font-size:13px;font-family:var(--sans);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{min-height:70px;resize:vertical;font-family:var(--sans);}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12.5px;cursor:pointer;
  background:var(--bg-2);color:var(--text-dim);user-select:none;
}
.chip.selected{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.check-row:last-child{border-bottom:none;}
.check-row input[type=checkbox]{margin-top:2px;width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;}
.check-row label{font-size:13px;color:var(--text);cursor:pointer;}
.framework-box{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:var(--bg-2);}
.framework-box .fw-title{font-family:var(--mono);font-size:12.5px;color:var(--accent);margin-bottom:2px;}
.framework-box .fw-sub{font-size:12px;color:var(--text-dim);margin-bottom:10px;font-style:italic;}
.wizard-steps{display:flex;gap:4px;margin-bottom:22px;flex-wrap:wrap;}
.wizard-step{
  flex:1;min-width:80px;text-align:center;padding:8px 4px;font-size:11.5px;color:var(--text-faint);
  border-bottom:2px solid var(--border);cursor:pointer;
}
.wizard-step.active{color:var(--accent);border-color:var(--accent);}
.wizard-step.done{color:var(--text-dim);border-color:var(--green);}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:9px 14px;font-size:13px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--text);border-color:var(--accent);}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:flex-start;justify-content:center;
  padding:4vh 16px;overflow-y:auto;z-index:100;
}
.modal{background:var(--bg-1);border:1px solid var(--border);border-radius:8px;max-width:760px;width:100%;padding:22px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h2{font-size:16px;margin:0;}
.close-x{cursor:pointer;color:var(--text-faint);font-size:20px;background:none;border:none;}
.toast-root{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--bg-3);border:1px solid var(--border);padding:10px 16px;border-radius:var(--radius);font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.3);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-state .big{font-size:14px;color:var(--text-dim);margin-bottom:6px;}
.reminder-strip{
  border:1px solid var(--border-soft);background:var(--bg-2);border-radius:var(--radius);
  padding:10px 14px;font-size:12.5px;color:var(--text-dim);font-style:italic;margin-bottom:18px;
}
.filters-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filters-bar select,.filters-bar input{width:auto;min-width:120px;}
.sample-tag{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--bg-3);color:var(--text-faint);}
.sample-tag.useful{color:var(--green);}
.sample-tag.developing{color:var(--amber);}
.sample-tag.low{color:var(--text-faint);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:800px){.two-col{grid-template-columns:1fr;}}
.thumb-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.thumb{width:74px;height:74px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer;}
.upload-box{border:1px dashed var(--border);border-radius:var(--radius);padding:14px;text-align:center;color:var(--text-faint);font-size:12px;cursor:pointer;}
.divider{height:1px;background:var(--border);margin:20px 0;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.kv .k{color:var(--text-dim);}
.kv .v{font-family:var(--mono);}
.progress-note{font-size:12px;color:var(--text-faint);margin-top:-10px;margin-bottom:16px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
@media(max-width:880px){
  .sidebar{display:none;}
  main{padding:16px 14px 90px 14px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg-1);
    border-top:1px solid var(--border);z-index:50;justify-content:space-around;padding:6px 0;
  }
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-faint);text-decoration:none;font-size:10px;padding:4px 6px;}
  .bottom-nav a.active{color:var(--accent);}
  .bottom-nav svg{width:18px;height:18px;}
  .grid-4,.grid-3{grid-template-columns:1fr 1fr;}
}
</style>

<script>
/* =========================================================================
   EDGE RESEARCH SYSTEM — TRADING JOURNAL
   Single-file local-first application (IndexedDB persistence)

/* ---------------------------------------------------------------------

    },
    {

      checks: [

      checks: [

    },
    {
      key: "london_continuation", session: "London", label: "London : Continuation",
      location: "On validation zone of Asia",
      checks: [
        { id: "t1", label: "CONFIRMATION C2 [5m CISD >confirm> 1h Closure]" },
        { id: "t2", label: "ENTRY C3 [15m, 5m CISD]" }
      ]
    },
    {
      key: "ny_continuation", session: "New York", label: "New York : Continuation",
      location: "On validation zone of London",
      checks: [
        { id: "t1", label: "CONFIRMATION C2 [5m CISD >confirm> 1h Closure]" },
        { id: "t2", label: "ENTRY C3 [15m, 5m CISD]" }
      ]
    }
  ]
});

const SESSIONS = ["Asia", "London", "New York"];
const MARKET_CONDITIONS = ["Expansion", "Retracement", "Consolidation", "Reversal"];
const PSYCH_STATES = ["Calm", "Fear", "FOMO", "Greed", "Revenge", "Overconfidence", "Impatient", "Other"];
const EXIT_TYPES = ["SL", "BE", "TP", "Trailing Stop", "Manual Exit", "Other"];
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const REMINDERS = [
  "I do not need to win this trade.",
  "I do not need to pass today.",
  "I do not need to make profit every day.",
  "I do not need to prove anything to the market.",
  "My job is to wait for my setup.",
  "When it comes, I accept the defined risk.",
  "When it ends, I accept the outcome.",
  "Win without becoming overconfident.",
  "Lose without becoming afraid.",
  "Profit without becoming greedy.",
  "Loss without revenge.",
  "No Setup = No Trade."
];

/* ---------------------------------------------------------------------
   2. INDEXEDDB LAYER
   --------------------------------------------------------------------- */
const DB_NAME = "edgeResearchDB";
const DB_VERSION = 2; // v2: added "accounts" store (Account Management patch). Existing stores are untouched on upgrade.
let dbInstance = null;
let USE_MEMORY_FALLBACK = false; // true when IndexedDB is unavailable/blocked/hangs (e.g. sandboxed preview)

// In-memory fallback store — same shape/keys as the IndexedDB stores. Used only when
// real IndexedDB cannot be opened, so the app still loads and works (data just won't
// persist across a reload in that specific environment).
const MEM_STORE = { trades: new Map(), playbook: new Map(), weeklyReviews: new Map(), kv: new Map(), accounts: new Map() };
const MEM_KEYPATH = { trades: "tradeId", playbook: "id", weeklyReviews: "id", kv: "key", accounts: "id" };

function openDB() {
  return new Promise((resolve) => {
    if (typeof indexedDB === "undefined" || !indexedDB) { USE_MEMORY_FALLBACK = true; resolve(null); return; }
    let settled = false;
    // Some sandboxed/embedded preview contexts silently hang on indexedDB.open() instead
    // of firing onerror. A timeout guarantees the app always finishes loading either way.
    const timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      USE_MEMORY_FALLBACK = true;
      resolve(null);
    }, 2500);
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("trades")) db.createObjectStore("trades", { keyPath: "tradeId" });
        if (!db.objectStoreNames.contains("playbook")) db.createObjectStore("playbook", { keyPath: "id" });
        if (!db.objectStoreNames.contains("weeklyReviews")) db.createObjectStore("weeklyReviews", { keyPath: "id" });
        if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv", { keyPath: "key" });
        if (!db.objectStoreNames.contains("accounts")) db.createObjectStore("accounts", { keyPath: "id" });
      };
      req.onsuccess = (e) => {
        if (settled) return;
        settled = true; clearTimeout(timeoutId);
        dbInstance = e.target.result;
        resolve(dbInstance);
      };
      req.onerror = () => {
        if (settled) return;
        settled = true; clearTimeout(timeoutId);
        USE_MEMORY_FALLBACK = true;
        resolve(null);
      };
      req.onblocked = () => { /* left to the timeout above */ };
    } catch (err) {
      clearTimeout(timeoutId);
      USE_MEMORY_FALLBACK = true;
      resolve(null);
    }
  });
}

function tx(storeName, mode) {
  return dbInstance.transaction(storeName, mode).objectStore(storeName);
}
function idbGetAll(storeName) {
  if (USE_MEMORY_FALLBACK) return Promise.resolve(Array.from(MEM_STORE[storeName].values()));
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readonly").getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(storeName, key) {
  if (USE_MEMORY_FALLBACK) return Promise.resolve(MEM_STORE[storeName].has(key) ? MEM_STORE[storeName].get(key) : null);
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readonly").get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function idbPut(storeName, value) {
  if (USE_MEMORY_FALLBACK) {
    const kp = MEM_KEYPATH[storeName];
    MEM_STORE[storeName].set(value[kp], value);
    return Promise.resolve(value);
  }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readwrite").put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}
function idbDelete(storeName, key) {
  if (USE_MEMORY_FALLBACK) { MEM_STORE[storeName].delete(key); return Promise.resolve(); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readwrite").delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function idbClear(storeName) {
  if (USE_MEMORY_FALLBACK) { MEM_STORE[storeName].clear(); return Promise.resolve(); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readwrite").clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ---------------------------------------------------------------------
   3. UTILITIES
   --------------------------------------------------------------------- */
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtNum(n, digits = 2) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toFixed(digits);
}
function fmtCurrency(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtR(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const sign = n > 0 ? "+" : "";
  return sign + Number(n).toFixed(2) + "R";
}
function fmtPF(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  if (n === Infinity) return "∞";
  return fmtNum(n);
}
function fmtPct(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toFixed(1) + "%";
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function nowTimeStr() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsText(file);
  });
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function toast(msg) {
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;

function csvEscape(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

/* ---------------------------------------------------------------------
   6. CALCULATION ENGINE
   --------------------------------------------------------------------- */
function computeExecutionTotal(er) {
  const c = Number(er.contextScore) || 0;
  const f = Number(er.frameworkScore) || 0;
  const e = Number(er.entryScore) || 0;
  const r = Number(er.riskScore) || 0;
  const m = Number(er.managementScore) || 0;
  return c + f + e + r + m;
}

function computeClassification(trade) {
  const finalR = Number(trade.management.finalR);
  const hasResult = trade.management.finalR !== "" && trade.management.finalR !== null && !isNaN(finalR);
  const frameworkValid = trade.review.validSetup === true;
  const ruleBreak = trade.executionReview.ruleBreak === "YES";
  const totalScore = computeExecutionTotal(trade.executionReview);
  const goodExecution = totalScore >= (SETTINGS?.goodExecutionThreshold || 70) && !ruleBreak;

  const cls = { goodWin: false, goodLoss: false, badWin: false, badLoss: false, label: "" };
  if (!hasResult) { cls.label = "PENDING"; return cls; }
  if (finalR === 0) { cls.label = "BREAKEVEN"; return cls; }

  const isWin = finalR > 0;
  const isGoodProcess = frameworkValid && goodExecution;

  if (isGoodProcess && isWin) { cls.goodWin = true; cls.label = "GOOD WIN"; }
  else if (isGoodProcess && !isWin) { cls.goodLoss = true; cls.label = "GOOD LOSS"; }
  else if (!isGoodProcess && isWin) { cls.badWin = true; cls.label = "BAD WIN"; }
  else { cls.badLoss = true; cls.label = "BAD LOSS"; }
  return cls;
}

function deriveTrade(trade) {
  // Execution score total
  trade.executionReview.totalScore = computeExecutionTotal(trade.executionReview);
  // Framework validity mirrors the user's own Final Review answer (never auto-decided from Framework text)
  trade.framework.frameworkValid = trade.review.validSetup;
  // Classification (process vs outcome separation)
  trade.classification = computeClassification(trade);
  trade.updatedAt = new Date().toISOString();
  return trade;
}

function tradeResultType(trade) {
  const fr = Number(trade.management.finalR);
  if (trade.management.finalR === "" || trade.management.finalR === null || isNaN(fr)) return "pending";
  if (fr > 0) return "win";
  if (fr < 0) return "loss";
  return "breakeven";
}

/* Aggregate statistics over an array of trades (closed trades only unless noted) */
function computeAggregateStats(trades) {
  const closed = trades.filter(t => tradeResultType(t) === "win" || tradeResultType(t) === "loss" || tradeResultType(t) === "breakeven");
  const wins = closed.filter(t => tradeResultType(t) === "win");
  const losses = closed.filter(t => tradeResultType(t) === "loss");
  const n = closed.length;
  const winRate = n ? (wins.length / n) * 100 : 0;
  const lossRate = n ? (losses.length / n) * 100 : 0;
  const avgWinR = wins.length ? wins.reduce((s, t) => s + Number(t.management.finalR), 0) / wins.length : 0;
  const avgLossR = losses.length ? Math.abs(losses.reduce((s, t) => s + Number(t.management.finalR), 0) / losses.length) : 0;
  const expectancy = (winRate / 100) * avgWinR - (lossRate / 100) * avgLossR;
  const grossWinR = wins.reduce((s, t) => s + Number(t.management.finalR), 0);
  const grossLossR = Math.abs(losses.reduce((s, t) => s + Number(t.management.finalR), 0));
  const profitFactor = grossLossR > 0 ? grossWinR / grossLossR : (grossWinR > 0 ? Infinity : NaN);
  const netR = closed.reduce((s, t) => s + (Number(t.management.finalR) || 0), 0);
  const netPnL = closed.reduce((s, t) => s + (Number(t.management.finalPnL) || 0), 0);
  const avgR = n ? netR / n : 0;
  const avgExecution = trades.length ? trades.reduce((s, t) => s + (Number(t.executionReview.totalScore) || 0), 0) / trades.length : 0;
  const validCount = trades.filter(t => t.review.validSetup === true).length;
  const frameworkCompliance = trades.length ? (validCount / trades.length) * 100 : 0;

  // Drawdown & streaks based on chronological R sequence
  const chron = [...closed].sort((a, b) => new Date(a.date + "T" + (a.time || "00:00")) - new Date(b.date + "T" + (b.time || "00:00")));
  let equity = 0, peak = 0, maxDD = 0;
  let curStreak = 0, curType = null, winStreak = 0, lossStreak = 0;
  chron.forEach(t => {
    const r = Number(t.management.finalR) || 0;
    equity += r;
    if (equity > peak) peak = equity;
    const dd = peak - equity;
    if (dd > maxDD) maxDD = dd;
    const rt = tradeResultType(t);
    if (rt === curType) { curStreak++; } else { curStreak = 1; curType = rt; }
    if (rt === "win") winStreak = Math.max(winStreak, curStreak);
    if (rt === "loss") lossStreak = Math.max(lossStreak, curStreak);
  });

  return {
    totalTrades: trades.length,
    closedTrades: n,
    winRate, lossRate, avgWinR, avgLossR, expectancy, profitFactor,
    netR, netPnL, avgR, avgExecution, frameworkCompliance,
    maxDrawdownR: maxDD, winStreak, lossStreak
  };
}

function sampleSizeLabel(n) {
  if (n >= 100) return { label: "Stronger Evidence", cls: "useful" };
  if (n >= 50) return { label: "Useful Sample", cls: "useful" };
  if (n >= 30) return { label: "Developing Sample", cls: "developing" };
  if (n >= 10) return { label: "Low Sample", cls: "low" };
  return { label: "Very Low Sample", cls: "low" };
}

/* Group trades by a dimension extractor function, return array of {key, trades, stats, sample} */
function groupTrades(trades, keyFn) {
  const map = new Map();
  trades.forEach(t => {
    const k = keyFn(t);
    if (k === null || k === undefined || k === "") return;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(t);
  });
  const out = [];
  map.forEach((list, key) => {
    out.push({ key, trades: list, stats: computeAggregateStats(list), sample: sampleSizeLabel(list.length) });
  });
  return out;
}

  if (location.hash === hash) { router(); return; }
  location.hash = hash;

function renderNav() {
  const cur = location.hash || "#/dashboard";
  const navlist = document.getElementById("navlist");
  navlist.innerHTML = ROUTES.map(r => `<li><a data-hash="${r.hash}" tabindex="0" role="link" class="${cur.startsWith(r.hash) ? 'active' : ''}">${ICONS[r.icon]}<span>${r.label}</span></a></li>`).join("");
  const bn = document.getElementById("bottomNav");
  bn.innerHTML = ROUTES.map(r => `<a data-hash="${r.hash}" tabindex="0" role="link" class="${cur.startsWith(r.hash) ? 'active' : ''}">${ICONS[r.icon]}<span>${r.label}</span></a>`).join("");

  });

function classificationBadge(t) {
  const l = t.classification.label;
  if (!l || l === "PENDING") return '<span class="badge neutral">PENDING</span>';
  if (l === "BREAKEVEN") return '<span class="badge neutral">BREAKEVEN</span>';
  const cls = l.toLowerCase().replace(" ", "-");
  return `<span class="badge ${cls}">${esc(l)}</span>`;
}

function renderSparkline(points) {
  const w = 900, h = 180, pad = 20;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rangeY = (maxY - minY) || 1;
  const maxX = Math.max(...xs) || 1;
  const path = points.map((p, i) => {
    const x = pad + (p.x / maxX) * (w - pad * 2);
    const y = h - pad - ((p.y - minY) / rangeY) * (h - pad * 2);
    return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  const last = points[points.length - 1];
  const color = last.y >= points[0].y ? "var(--green)" : "var(--red)";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:180px;">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
  </svg>`;
}

function renderNewTrade(main, editId) {

      wizardStep = 0;

  }

  main.innerHTML = `

function bindStep3() {
  const t = wizardTrade;
  const recalc = () => {
    const entry = Number(t.execution.entry), sl = Number(t.execution.stopLoss), target = Number(t.execution.target);
    const contracts = Number(t.execution.contracts) || 0, pv = Number(t.execution.pointValue) || 1;
    let riskCalc = null, rewardCalc = null, rr = null;
    if (!isNaN(entry) && !isNaN(sl) && contracts) riskCalc = Math.abs(entry - sl) * contracts * pv;
    if (!isNaN(entry) && !isNaN(target) && contracts) rewardCalc = Math.abs(target - entry) * contracts * pv;
    if (riskCalc && rewardCalc) rr = rewardCalc / riskCalc;
    document.getElementById("calcRisk").textContent = riskCalc !== null ? fmtCurrency(riskCalc) : "—";
    document.getElementById("calcReward").textContent = rewardCalc !== null ? fmtCurrency(rewardCalc) : "—";
    document.getElementById("calcRR").textContent = rr !== null ? fmtNum(rr) + " : 1" : "—";
    t.execution.plannedRR = rr !== null ? rr.toFixed(2) : "";
    if (!t.execution.risk && riskCalc !== null) t.execution.risk = riskCalc.toFixed(2);
    const warnEl = document.getElementById("riskWarning");
    const maxRisk = Number(SETTINGS.riskControl.maxRiskAmount);
    const effectiveRisk = Number(t.execution.risk) || riskCalc;
    if (SETTINGS.riskControl.enforceMaxRisk && maxRisk && effectiveRisk && effectiveRisk > maxRisk) {
      warnEl.innerHTML = `<div class="hint" style="color:var(--red);margin-top:10px;">WARNING: Risk exceeds configured maximum (${fmtCurrency(maxRisk)}).</div>`;
    } else { warnEl.innerHTML = ""; }
  };
  ["entry","stopLoss","target","contracts","pointValue","risk"].forEach(f => {
    const id = "f_" + (f === "stopLoss" ? "sl" : f);
    document.getElementById(id).oninput = e => { t.execution[f] = e.target.value; recalc(); };
  });
  document.getElementById("f_actualRR").oninput = e => t.execution.actualRR = e.target.value;
  recalc();
}

async function saveWizardTrade() {
  if (!wizardTrade.accountId) {
    toast("Please select an Account before saving.");
    wizardStep = 0; renderWizardSteps(); renderWizardStepBody();

  deriveTrade(wizardTrade);

async function persistTrade(trade) {
  deriveTrade(trade);

  if (idx >= 0) TRADES[idx] = trade; else TRADES.push(trade);

let journalFilters = { account: "", session: "", instrument: "", direction: "", bias: "", trigger: "", frameworkValid: "", classification: "", entryStyle: "", search: "", from: "", to: "" };
let journalSort = { key: "date", dir: "desc" };

function applyJournalFilters(list) {
  return list.filter(t => {
    if (journalFilters.account && t.accountId !== journalFilters.account) return false;
    if (journalFilters.entryStyle === "Unclassified" && t.entryExecutionStyle) return false;
    if (journalFilters.entryStyle && journalFilters.entryStyle !== "Unclassified" && t.entryExecutionStyle !== journalFilters.entryStyle) return false;
    if (journalFilters.session && t.session !== journalFilters.session) return false;
    if (journalFilters.instrument && !t.instrument.toLowerCase().includes(journalFilters.instrument.toLowerCase())) return false;
    if (journalFilters.direction && t.direction !== journalFilters.direction) return false;
    if (journalFilters.bias && t.framework.bias !== journalFilters.bias) return false;
    if (journalFilters.trigger && t.framework.trigger !== journalFilters.trigger) return false;
    if (journalFilters.frameworkValid === "valid" && t.review.validSetup !== true) return false;
    if (journalFilters.frameworkValid === "invalid" && t.review.validSetup !== false) return false;
    if (journalFilters.classification && t.classification.label !== journalFilters.classification) return false;
    if (journalFilters.from && t.date < journalFilters.from) return false;
    if (journalFilters.to && t.date > journalFilters.to) return false;
    if (journalFilters.search) {
      const s = journalFilters.search.toLowerCase();
      const hay = [t.instrument, t.notes, t.review.lesson, t.review.nextTime].join(" ").toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });
}

  let list = applyJournalFilters(TRADES);

    else { av = a[journalSort.key]; bv = b[journalSort.key]; }
    if (av < bv) return journalSort.dir === "asc" ? -1 : 1;

  bindSel("jf_account", "account"); bindSel("jf_session", "session"); bindSel("jf_direction", "direction"); bindSel("jf_bias", "bias"); bindSel("jf_trigger", "trigger"); bindSel("jf_valid", "frameworkValid"); bindSel("jf_class", "classification"); bindSel("jf_entryStyle", "entryStyle");
  document.getElementById("jf_clear").onclick = () => { journalFilters = { account: "", session: "", instrument: "", direction: "", bias: "", trigger: "", frameworkValid: "", classification: "", entryStyle: "", search: "", from: "", to: "" }; renderJournal(main); };

function edgeTable(groups, order) {
  if (!groups.length) return '<div class="empty-state">No data yet.</div>';
  if (order) groups.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  else groups.sort((a, b) => b.stats.expectancy - a.stats.expectancy);
  return `<table>
    <thead><tr><th>Group</th><th>Trades</th><th>Win Rate</th><th>Avg R</th><th>Expectancy</th><th>Profit Factor</th><th>Avg Execution</th><th>Sample</th></tr></thead>
    <tbody>
    ${groups.map(g => `
      <tr>
        <td style="white-space:normal;">${esc(g.key)}</td>
        <td>${g.trades.length}</td>
        <td>${fmtPct(g.stats.winRate)}</td>
        <td class="${g.stats.avgR>=0?'pos':'neg'}">${fmtR(g.stats.avgR)}</td>
        <td class="${g.stats.expectancy>=0?'pos':'neg'}">${fmtR(g.stats.expectancy)}</td>
        <td>${fmtPF(g.stats.profitFactor)}</td>
        <td>${fmtNum(g.stats.avgExecution,1)}</td>
        <td><span class="sample-tag ${g.sample.cls}">${g.sample.label} (${g.trades.length})</span></td>
      </tr>`).join("")}
    </tbody>
  </table>`;
}

/* ADD-ONLY: Entry Execution Style research tables.
   Both renderers reuse the existing computeAggregateStats() and sampleSizeLabel()
   helpers — no metric is recalculated or redefined here. Unclassified trades are
   counted and shown, but are deliberately excluded from the Aggressive and
   Conservative rows. Nothing here recommends a style; it only reports the data. */
function entryStyleTable(trades) {
  const groups = [
    { key: "All Trades", trades: trades },
    { key: "Aggressive", trades: trades.filter(t => t.entryExecutionStyle === "Aggressive") },
    { key: "Conservative", trades: trades.filter(t => t.entryExecutionStyle === "Conservative") },
    { key: "Unclassified", trades: trades.filter(t => !t.entryExecutionStyle) }
  ];
  if (!trades.length) return '<div class="empty-state">No data yet.</div>';
  return `<table>
    <thead><tr>
      <th>Group</th><th>n</th><th>Win Rate</th><th>Loss Rate</th><th>Total R</th><th>Avg R</th>
      <th>Avg Win R</th><th>Avg Loss R</th><th>Expectancy</th><th>Profit Factor</th>
      <th>Max Win Streak</th><th>Max Loss Streak</th><th>Sample</th>
    </tr></thead>
    <tbody>
    ${groups.map(g => {
      const n = g.trades.length;
      if (!n) {
        // Zero-sample group: show the count only, never fabricated statistics.
        return `<tr><td>${esc(g.key)}</td><td>0</td><td colspan="11" style="color:var(--text-faint);white-space:normal;">No classified trades</td></tr>`;
      }
      const s = computeAggregateStats(g.trades);
      const sample = sampleSizeLabel(n);
      return `<tr>
        <td>${esc(g.key)}</td>
        <td>${n}</td>
        <td>${fmtPct(s.winRate)}</td>
        <td>${fmtPct(s.lossRate)}</td>
        <td class="${s.netR>=0?'pos':'neg'}">${fmtR(s.netR)}</td>
        <td class="${s.avgR>=0?'pos':'neg'}">${fmtR(s.avgR)}</td>
        <td>${fmtR(s.avgWinR)}</td>
        <td>-${fmtNum(s.avgLossR)}R</td>
        <td class="${s.expectancy>=0?'pos':'neg'}">${fmtR(s.expectancy)}</td>
        <td>${fmtPF(s.profitFactor)}</td>
        <td>${s.winStreak}</td>
        <td>${s.lossStreak}</td>
        <td><span class="sample-tag ${sample.cls}">${sample.label}</span></td>
      </tr>`;
    }).join("")}
    </tbody>
  </table>`;
}

function triggerByEntryStyleTable(trades) {
  // Trigger list comes from the data itself via the existing DIMENSIONS.trigger accessor,
  // so every Trigger in the model — including any added later — appears automatically.
  const triggerGroups = groupTrades(trades, DIMENSIONS.trigger.fn);
  if (!triggerGroups.length) return '<div class="empty-state">No data yet.</div>';
  triggerGroups.sort((a, b) => String(a.key).localeCompare(String(b.key)));
  const cell = (list) => {
    if (!list.length) return `<td colspan="4" style="color:var(--text-faint);">—</td>`;
    const s = computeAggregateStats(list);
    return `<td>${list.length}</td>
      <td>${fmtPct(s.winRate)}</td>
      <td class="${s.avgR>=0?'pos':'neg'}">${fmtR(s.avgR)}</td>
      <td class="${s.expectancy>=0?'pos':'neg'}">${fmtR(s.expectancy)}</td>`;
  };
  return `<table>
    <thead>
      <tr>
        <th rowspan="2" style="vertical-align:bottom;">Trigger</th>
        <th colspan="4" style="border-bottom:none;">Aggressive</th>
        <th colspan="4" style="border-bottom:none;">Conservative</th>
        <th rowspan="2" style="vertical-align:bottom;">Unclassified</th>
      </tr>
      <tr>
        <th>n</th><th>Win Rate</th><th>Avg R</th><th>Expectancy</th>
        <th>n</th><th>Win Rate</th><th>Avg R</th><th>Expectancy</th>
      </tr>
    </thead>
    <tbody>
    ${triggerGroups.map(g => {
      const agg = g.trades.filter(t => t.entryExecutionStyle === "Aggressive");
      const con = g.trades.filter(t => t.entryExecutionStyle === "Conservative");
      const unc = g.trades.filter(t => !t.entryExecutionStyle).length;
      return `<tr>
        <td style="white-space:normal;">${esc(g.key)}</td>
        ${cell(agg)}
        ${cell(con)}
        <td>${unc}</td>
      </tr>`;
    }).join("")}
    </tbody>
  </table>`;
}

function renderMatrixResults() {
  const area = document.getElementById("matrixResults");
  if (!area) return;
  if (!edgeMatrixDims.length) { area.innerHTML = '<div class="hint">Select 1–3 dimensions above.</div>'; return; }
  const matrixTrades = analyticsAccountId ? TRADES.filter(t => t.accountId === analyticsAccountId) : TRADES;
  const keyFn = t => edgeMatrixDims.map(d => DIMENSIONS[d].fn(t) || "—").join(" × ");
  const groups = groupTrades(matrixTrades, keyFn).sort((a, b) => b.stats.expectancy - a.stats.expectancy);
  if (!groups.length) { area.innerHTML = '<div class="empty-state">No matching data yet.</div>'; return; }
  area.innerHTML = groups.map(g => {
    const isUseful = g.trades.length >= 30;

function periodBounds(period) {
  const now = new Date();
  let start;
  if (period === "daily") { start = new Date(now); start.setHours(0,0,0,0); }
  else if (period === "weekly") { start = new Date(now); const day = start.getDay(); const diff = (day === 0 ? -6 : 1) - day; start.setDate(start.getDate() + diff); start.setHours(0,0,0,0); }
  else { start = new Date(now.getFullYear(), now.getMonth(), 1); }
  return { start: start.toISOString().slice(0,10), end: todayISO() };
}

function renderPeriodReview(body, period) {
  const { start, end } = periodBounds(period);
  const scoped = reviewAccountId ? TRADES.filter(t => t.accountId === reviewAccountId) : TRADES;
  const inPeriod = scoped.filter(t => t.date >= start && t.date <= end);
  const stats = computeAggregateStats(inPeriod);
  const ruleBreaks = inPeriod.filter(t => t.executionReview.ruleBreak === "YES").length;

  const bestWorst = (dim) => {
    const groups = groupTrades(inPeriod, DIMENSIONS[dim].fn).filter(g => g.trades.length >= 1);
    if (!groups.length) return { best: null, worst: null };
    const sorted = [...groups].sort((a,b) => b.stats.expectancy - a.stats.expectancy);
    return { best: sorted[0], worst: sorted[sorted.length - 1] };
  };
  const biasBW = bestWorst("bias"), triggerBW = bestWorst("trigger"), sessionBW = bestWorst("session"), mcBW = bestWorst("marketCondition");

  const pastReviews = REVIEWS.filter(r => r.period === period).sort((a,b) => b.savedAt.localeCompare(a.savedAt));

  body.innerHTML = `
    <div class="card">
      <div class="hint" style="margin-bottom:10px;">Period: ${esc(start)} → ${esc(end)}</div>
      <div class="grid grid-4">
        <div class="kv"><span class="k">Total Trades</span><span class="v">${stats.totalTrades}</span></div>
        <div class="kv"><span class="k">Net P&amp;L</span><span class="v">${fmtCurrency(stats.netPnL)}</span></div>
        <div class="kv"><span class="k">Net R</span><span class="v">${fmtR(stats.netR)}</span></div>
        <div class="kv"><span class="k">Win Rate</span><span class="v">${fmtPct(stats.winRate)}</span></div>
        <div class="kv"><span class="k">Avg Win / Loss (R)</span><span class="v">${fmtR(stats.avgWinR)} / -${fmtNum(stats.avgLossR)}R</span></div>
        <div class="kv"><span class="k">Expectancy</span><span class="v">${fmtR(stats.expectancy)}</span></div>
        <div class="kv"><span class="k">Profit Factor</span><span class="v">${fmtPF(stats.profitFactor)}</span></div>
        <div class="kv"><span class="k">Max Drawdown (R)</span><span class="v">${fmtNum(stats.maxDrawdownR)}R</span></div>
        <div class="kv"><span class="k">Avg Execution</span><span class="v">${fmtNum(stats.avgExecution,1)}</span></div>
        <div class="kv"><span class="k">Framework Compliance</span><span class="v">${fmtPct(stats.frameworkCompliance)}</span></div>
        <div class="kv"><span class="k">Rule Breaks</span><span class="v">${ruleBreaks}</span></div>
      </div>
    </div>

    <div class="section-title">Best Historical Performance <span class="hint">(not a prediction)</span></div>
    <div class="grid grid-2">
      <div class="card">
        <div class="kv"><span class="k">Best Bias</span><span class="v">${biasBW.best ? esc(biasBW.best.key) : '—'}</span></div>
        <div class="kv"><span class="k">Best Trigger</span><span class="v">${triggerBW.best ? esc(triggerBW.best.key) : '—'}</span></div>
        <div class="kv"><span class="k">Best Session</span><span class="v">${sessionBW.best ? esc(sessionBW.best.key) : '—'}</span></div>
        <div class="kv"><span class="k">Best Market Condition</span><span class="v">${mcBW.best ? esc(mcBW.best.key) : '—'}</span></div>
      </div>
      <div class="card">
        <div class="kv"><span class="k">Worst Bias</span><span class="v">${biasBW.worst ? esc(biasBW.worst.key) : '—'}</span></div>
        <div class="kv"><span class="k">Worst Trigger</span><span class="v">${triggerBW.worst ? esc(triggerBW.worst.key) : '—'}</span></div>
        <div class="kv"><span class="k">Worst Session</span><span class="v">${sessionBW.worst ? esc(sessionBW.worst.key) : '—'}</span></div>
        <div class="kv"><span class="k">Worst Market Condition</span><span class="v">${mcBW.worst ? esc(mcBW.worst.key) : '—'}</span></div>
      </div>
    </div>
    <div class="hint" style="margin-top:8px;">Findings are informational. The system never auto-modifies your Framework — you decide whether to keep, modify, backtest, or remove anything.</div>

    <div class="section-title">${period.charAt(0).toUpperCase()+period.slice(1)} Reflection</div>
    <div class="card">
      <div class="field"><label>What worked?</label><textarea id="rv_worked"></textarea></div>
      <div class="field"><label>What failed?</label><textarea id="rv_failed"></textarea></div>
      <div class="field"><label>What did I learn?</label><textarea id="rv_learned"></textarea></div>
      <div class="field"><label>What will I change next ${period === 'daily' ? 'day' : period === 'weekly' ? 'week' : 'month'}?</label><textarea id="rv_change"></textarea></div>
      <button class="btn primary" id="saveReviewBtn">Save ${period.charAt(0).toUpperCase()+period.slice(1)} Review</button>
    </div>

    ${pastReviews.length ? `
    <div class="section-title">Saved Reviews</div>
    ${pastReviews.map(r => `
      <div class="card" style="margin-bottom:10px;">
        <div class="hint">${esc(r.start)} → ${esc(r.end)} · saved ${new Date(r.savedAt).toLocaleString()}</div>
        <p><b>Worked:</b> ${esc(r.worked)||'—'}</p>
        <p><b>Failed:</b> ${esc(r.failed)||'—'}</p>
        <p><b>Learned:</b> ${esc(r.learned)||'—'}</p>
        <p><b>Change:</b> ${esc(r.change)||'—'}</p>
      </div>
    `).join("")}` : ""}
  `;

  document.getElementById("saveReviewBtn").onclick = async () => {
    const review = {
      id: uuid(), period, start, end, savedAt: new Date().toISOString(),
      worked: document.getElementById("rv_worked").value,
      failed: document.getElementById("rv_failed").value,
      learned: document.getElementById("rv_learned").value,
      change: document.getElementById("rv_change").value,
      stats
    };
    await idbPut("weeklyReviews", review);
    REVIEWS.push(review);
    toast("Review saved.");
    renderReview(document.getElementById("main-content"));
  };
}

/* ---------------------------------------------------------------------
   14b. ACCOUNT MANAGEMENT (list / add / edit / archive / delete-guard)
   --------------------------------------------------------------------- */
function renderAccountsList() {
  const list = document.getElementById("accountsList");
  if (!list) return;
  if (!ACCOUNTS.length) { list.innerHTML = '<div class="empty-state">No Accounts yet. Add one to start logging Trades.</div>'; return; }
  const active = ACCOUNTS.filter(a => !a.archived);
  const archived = ACCOUNTS.filter(a => a.archived);
  list.innerHTML = [...active, ...archived].map(a => {
    const tradeCount = TRADES.filter(t => t.accountId === a.id).length;
    return `
    <div class="card" style="margin-bottom:10px;opacity:${a.archived ? 0.55 : 1};">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
        <div>
          <div style="font-weight:600;font-size:14.5px;">${esc(a.name)} ${a.archived ? '<span class="hint">(archived)</span>' : ''}</div>
          <div class="hint">${fmtCurrency(a.accountSize)} · ${tradeCount} trade(s)</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn sm" data-act="edit" data-id="${a.id}">Edit</button>
          <button class="btn sm" data-act="arch" data-id="${a.id}">${a.archived ? 'Unarchive' : 'Archive'}</button>
          <button class="btn sm danger" data-act="del" data-id="${a.id}">Delete</button>
        </div>
      </div>
    </div>`;
  }).join("");
  list.querySelectorAll("button[data-act]").forEach(btn => {
    btn.onclick = async () => {
      const a = getAccountById(btn.dataset.id);
      if (!a) return;
      if (btn.dataset.act === "edit") {
        openAccountEditor(a);
      } else if (btn.dataset.act === "arch") {
        await archiveAccount(a.id, !a.archived);
        renderAccountsList();
        toast(a.archived ? "Account archived." : "Account unarchived.");
      } else if (btn.dataset.act === "del") {
        const tradeCount = TRADES.filter(t => t.accountId === a.id).length;
        if (tradeCount > 0) {
          if (confirm(`This account contains ${tradeCount} trade(s). Trades are never deleted automatically.\n\nArchive "${a.name}" instead? (Cancel to do nothing)`)) {
            await archiveAccount(a.id, true);
            renderAccountsList();
            toast("Account archived (trades preserved).");
          }
          return;
        }
        if (confirm(`Delete empty account "${a.name}"? This cannot be undone.`)) {
          await idbDelete("accounts", a.id);
          ACCOUNTS = ACCOUNTS.filter(x => x.id !== a.id);
          renderAccountsList();
          toast("Account deleted.");
        }
      }
    };
  });
}

/* ---------------------------------------------------------------------
   14c. IMPORT / MERGE (non-destructive — "new records only")
   Rule: EXISTING ID -> KEEP LOCAL. NEW ID -> ADD. Never overwrite,
   never delete, never touch local Settings. Restore (above) is the only
   destructive path, and it is a separate, explicitly-labeled button.

   Account matching (bugfix): an imported Account is matched against local
   Accounts in this order —
     1) by accountId (exact match -> same account, no remap needed)
     2) if no id match, by accountName:
          - exactly one local Account shares the name -> treat as the same
            account; imported trades are remapped onto the LOCAL id
          - two or more local Accounts share the name -> ambiguous, never
            auto-picked; surfaced to the user as an explicit conflict to
            resolve before the import can proceed
          - no local Account shares the name -> genuinely new Account
   Only genuinely-new Accounts are ever added. Existing Accounts (matched
   by id or by name) are never overwritten, renamed, or duplicated.
   --------------------------------------------------------------------- */
function previewImport(data, nameConflictResolutions) {
  nameConflictResolutions = nameConflictResolutions || {}; // { importedAccountId: localAccountId | "__new__" }
  const localTradeIds = new Set(TRADES.map(t => t.tradeId));
  const localAccountIds = new Set(ACCOUNTS.map(a => a.id));
  const importedAccountsRaw = Array.isArray(data.accounts) ? data.accounts : [];

  // Canonical remap: imported accountId -> the id that should actually be written to
  // Trades from here on (either an existing local id, or the imported account's own id
  // when it truly is new).
  const accountIdRemap = new Map();
  const accountsNew = [];            // genuinely new accounts to add (Rule: never auto-created otherwise)
  const accountsMatchedById = [];    // Rule 1: imported id already exists locally
  const accountsMatchedByName = [];  // Rule 2/3/4: no id match, but exactly one local account shares the name
  const nameConflicts = [];          // Rule 9: no id match, name matches 2+ local accounts — needs user input

  importedAccountsRaw.forEach(a => {
    if (!a || !a.id) return;
    // Rule 1: match by accountId first.
    if (localAccountIds.has(a.id)) {
      accountIdRemap.set(a.id, a.id);
      accountsMatchedById.push(a);
      return;
    }
    // Rule 2: accountId not found locally -> fall back to accountName.
    const candidates = ACCOUNTS.filter(local => local.name === a.name);
    if (candidates.length === 1) {
      // Rule 3/4: exactly one local account has this name -> same account, local id is canonical.
      accountIdRemap.set(a.id, candidates[0].id);
      accountsMatchedByName.push({ imported: a, local: candidates[0] });
    } else if (candidates.length > 1) {
      // Rule 9: ambiguous — never auto-pick.
      const resolution = nameConflictResolutions[a.id];
      if (resolution === "__new__") {
        accountIdRemap.set(a.id, a.id);
        accountsNew.push(a);
      } else if (resolution && localAccountIds.has(resolution)) {
        accountIdRemap.set(a.id, resolution);
        accountsMatchedByName.push({ imported: a, local: getAccountById(resolution) });
      } else {
        nameConflicts.push({ importedAccount: a, candidates });
      }
    } else {
      // No id match, no name match -> genuinely new account.
      accountIdRemap.set(a.id, a.id);
      accountsNew.push(a);
    }
  });

  // De-duplicate trades *within the file itself* by tradeId.
  const seen = new Set();
  const deduped = [];
  let duplicatesInFile = 0, invalidTrades = 0;
  (data.trades || []).forEach(t => {
    if (!t || !t.tradeId) { invalidTrades++; return; }
    if (seen.has(t.tradeId)) { duplicatesInFile++; return; }
    seen.add(t.tradeId);
    deduped.push(t);
  });

  const resolvableAccountIds = new Set([...localAccountIds, ...accountsNew.map(a => a.id)]);
  const tradesNew = [];
  const legacyNoAccount = [];
  let tradesExisting = 0;
  deduped.forEach(t => {
    if (localTradeIds.has(t.tradeId)) { tradesExisting++; return; }
    // Remap the trade's accountId from the imported id to the canonical local id
    // (Rule 5) BEFORE deciding where it lands. Existing-by-tradeId trades above are
    // never touched — this remap only ever applies to genuinely new trades.
    let resolvedAccountId = t.accountId;
    if (resolvedAccountId && accountIdRemap.has(resolvedAccountId)) {
      resolvedAccountId = accountIdRemap.get(resolvedAccountId);
    }
    if (resolvedAccountId && resolvableAccountIds.has(resolvedAccountId)) {
      t.accountId = resolvedAccountId; // canonical id from here on (Rule 6 then dedupes/adds by tradeId as before)
      tradesNew.push(t);
    } else {
      // Still unresolved: missing accountId, or blocked behind an unresolved name conflict.
      legacyNoAccount.push(t);
    }
  });

  return {
    accountsNew, accountsMatchedById, accountsMatchedByName, nameConflicts,
    tradesNew, legacyNoAccount, tradesExisting, duplicatesInFile, invalidTrades
  };
}

function openImportPreview(data, nameConflictResolutions) {
  const preview = previewImport(data, nameConflictResolutions);
  // Rule 9: if any imported Account name is ambiguous against local Accounts, stop and
  // ask the user to resolve each one explicitly before showing the merge preview at all.
  if (preview.nameConflicts.length && !nameConflictResolutions) {
    openImportNameConflictModal(data, preview.nameConflicts);
    return;
  }

  const root = document.getElementById("modal-root");
  const totalNew = preview.tradesNew.length + preview.legacyNoAccount.length;
  const activeAccounts = getActiveAccounts();
  root.innerHTML = `
    <div class="modal-backdrop" id="impBackdrop">
      <div class="modal">
        <div class="modal-head"><h2>Import / Merge Preview</h2><button class="close-x" id="impClose">&times;</button></div>
        <div class="grid grid-2">
          <div class="kv"><span class="k">Current data</span><span class="v">${TRADES.length} trade(s), ${ACCOUNTS.length} account(s)</span></div>
          <div class="kv"><span class="k">Imported file</span><span class="v">${(data.trades||[]).length} trade(s), ${(data.accounts||[]).length} account(s)</span></div>
        </div>
        <div class="divider"></div>
        <div class="kv"><span class="k">Accounts — new</span><span class="v pos">${preview.accountsNew.length}</span></div>
        <div class="kv"><span class="k">Accounts — matched by ID (already local)</span><span class="v">${preview.accountsMatchedById.length}</span></div>
        <div class="kv"><span class="k">Accounts — matched by name (merged, no duplicate)</span><span class="v">${preview.accountsMatchedByName.length}</span></div>
        <div class="kv"><span class="k">Trades — new</span><span class="v pos">${totalNew}</span></div>
        <div class="kv"><span class="k">Trades — already exist locally (skipped)</span><span class="v">${preview.tradesExisting}</span></div>
        <div class="kv"><span class="k">Duplicates inside file (skipped)</span><span class="v">${preview.duplicatesInFile}</span></div>
        <div class="kv"><span class="k">Invalid records (skipped)</span><span class="v">${preview.invalidTrades}</span></div>
        ${preview.accountsMatchedByName.length ? `<div class="hint" style="color:var(--accent);margin-top:8px;">🔗 Matched by name (imported ID differed, existing local account kept — no new account created): ${preview.accountsMatchedByName.map(m => `"${esc(m.imported.name)}" → local "${esc(m.local.name)}"`).join(", ")}</div>` : ""}
        ${preview.legacyNoAccount.length ? `
          <div class="divider"></div>
          <div class="field">
            <label>${preview.legacyNoAccount.length} imported trade(s) do not reference a resolvable Account. Select a destination:</label>
            <select id="imp_destAccount">
              ${activeAccounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}
            </select>
            ${!activeAccounts.length ? '<div class="hint" style="color:var(--red);">No active Account available — add one first.</div>' : ""}
          </div>
        ` : ""}
        <div class="divider"></div>
        <div class="hint"><b>Existing records will NOT be overwritten or deleted. Only new records will be added.</b> Local Settings are never changed by Import.</div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
          <button class="btn" id="impCancel">Cancel</button>
          <button class="btn primary" id="impConfirm" ${totalNew===0 && preview.accountsNew.length===0 ? 'disabled' : ''}>${totalNew>0 ? `Import ${totalNew} New Trade${totalNew===1?'':'s'}` : (preview.accountsNew.length>0 ? 'Import New Data' : 'Nothing New To Import')}</button>
        </div>
      </div>
    </div>
  `;
  const close = () => root.innerHTML = "";
  document.getElementById("impClose").onclick = close;
  document.getElementById("impCancel").onclick = close;
  document.getElementById("impBackdrop").onclick = e => { if (e.target.id === "impBackdrop") close(); };
  document.getElementById("impConfirm").onclick = async () => {
    const destSelect = document.getElementById("imp_destAccount");
    const destAccountId = destSelect ? destSelect.value : null;
    if (preview.legacyNoAccount.length && !destAccountId) { toast("Select a destination account for unresolved trades."); return; }
    await mergeImportedData(preview, destAccountId);
    close();
    router();
  };
}

// Rule 9 UI: lets the user explicitly choose, per ambiguous imported Account name,
// which local Account it really is (or to keep it as a separate new Account). Nothing
// is ever auto-selected here — the import cannot proceed past this until resolved.
function openImportNameConflictModal(data, conflicts) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop" id="impConflictBackdrop">
      <div class="modal">
        <div class="modal-head"><h2>Resolve Account Name Conflicts</h2><button class="close-x" id="impConflictClose">&times;</button></div>
        <div class="hint" style="margin-bottom:12px;">These imported Accounts don't match a local Account by ID, and their name matches more than one local Account. Choose the correct match for each — nothing is decided automatically.</div>
        ${conflicts.map((c, i) => `
          <div class="field">
            <label>Imported Account: <b>${esc(c.importedAccount.name)}</b> <span class="hint">(imported ID: ${esc(c.importedAccount.id)})</span></label>
            <select id="conflict_${i}">
              ${c.candidates.map(local => `<option value="${local.id}">Merge into "${esc(local.name)}" — local ID ${esc(local.id)}</option>`).join("")}
              <option value="__new__">Keep separate — add as a new Account</option>
            </select>
          </div>
        `).join("")}
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
          <button class="btn" id="impConflictCancel">Cancel</button>
          <button class="btn primary" id="impConflictContinue">Continue</button>
        </div>
      </div>
    </div>
  `;
  const close = () => root.innerHTML = "";
  document.getElementById("impConflictClose").onclick = close;
  document.getElementById("impConflictCancel").onclick = close;
  document.getElementById("impConflictBackdrop").onclick = e => { if (e.target.id === "impConflictBackdrop") close(); };
  document.getElementById("impConflictContinue").onclick = () => {
    const resolutions = {};
    conflicts.forEach((c, i) => { resolutions[c.importedAccount.id] = document.getElementById("conflict_" + i).value; });
    openImportPreview(data, resolutions);
  };
}

async function mergeImportedData(preview, destAccountId) {
  // 1. Only genuinely new accounts are added (Rule: never create duplicates). Accounts
  //    matched by ID or by name are never written here — their local record is untouched.
  for (const a of preview.accountsNew) {
    await idbPut("accounts", a);
    ACCOUNTS.push(a);
  }
  // 2. Legacy trades without a resolvable accountId get the chosen destination.
  preview.legacyNoAccount.forEach(t => { t.accountId = destAccountId; });
  // 3. Add only genuinely new trades (by tradeId) — existing IDs were already excluded in
  //    previewImport, and accountId on each was already remapped to the canonical local id.
  const toAdd = [...preview.tradesNew, ...preview.legacyNoAccount];
  for (const t of toAdd) {
    await idbPut("trades", t);
    TRADES.push(t);
  }
  const mergedByName = preview.accountsMatchedByName.length;
  toast(`Imported ${toAdd.length} new trade(s) and ${preview.accountsNew.length} new account(s). ${preview.tradesExisting} trade(s) already existed and were skipped.${mergedByName ? ' ' + mergedByName + ' account(s) matched by name and were merged into the existing account.' : ''}`);
}

function applyDisplaySettings() {
  document.body.setAttribute("data-theme", SETTINGS.display.theme);
  document.body.setAttribute("data-compact", SETTINGS.display.compact ? "1" : "0");
}

/* ---------------------------------------------------------------------
   15. DEMO DATA (off by default, fully removable)
   --------------------------------------------------------------------- */
function generateDemoTrades() {
  const out = [];
  const biases = FRAMEWORK.biasOptions;
  const sessions = SESSIONS;
  for (let i = 0; i < 24; i++) {
    const t = blankTrade();
    t.isDemo = true;
    const d = new Date(); d.setDate(d.getDate() - (24 - i) * 2);
    t.date = d.toISOString().slice(0, 10);
    t.session = sessions[i % sessions.length];
    t.instrument = ["NQ","MNQ","ES","MES"][i % 4];
    t.direction = i % 2 === 0 ? "Long" : "Short";
    const bias = biases[i % biases.length];
    t.framework.bias = bias;
    t.marketContext.dailyBias = bias;
    const conf = FRAMEWORK.confirmations[bias];
    t.framework.confirmationTitle = conf.title;
    conf.checks.forEach((c, idx) => { t.framework.confirmationChecks[c.id] = idx !== conf.checks.length - 1 || i % 3 !== 0; });
    const relevantTriggers = FRAMEWORK.triggers.filter(tr => tr.session === t.session);
    const trig = (relevantTriggers.length ? relevantTriggers : FRAMEWORK.triggers)[i % (relevantTriggers.length || FRAMEWORK.triggers.length)];
    t.framework.trigger = trig.label;
    trig.checks.forEach(c => { t.framework.triggerChecks[c.id] = true; });
    t.marketContext.marketCondition = MARKET_CONDITIONS[i % MARKET_CONDITIONS.length];
    const risk = 200;
    t.execution.risk = risk; t.execution.contracts = 2; t.execution.entry = 100; t.execution.stopLoss = 95; t.execution.target = 115;
    t.execution.plannedRR = "3.00";
    const win = i % 3 !== 0;
    const r = win ? (1 + (i % 3)) : -1;
    t.management.finalR = r.toFixed(2);
    t.management.finalPnL = (r * risk).toFixed(2);
    t.management.exitType = win ? "TP" : "SL";
    t.executionReview.contextScore = 14; t.executionReview.frameworkScore = 16; t.executionReview.entryScore = 15;
    t.executionReview.riskScore = 15; t.executionReview.managementScore = i % 4 === 0 ? 8 : 16;
    t.executionReview.ruleBreak = i % 7 === 0 ? "YES" : "NO";
    if (t.executionReview.ruleBreak === "YES") t.executionReview.ruleBreakDescription = "Entered before full confirmation.";
    t.review.followedPlan = t.executionReview.ruleBreak === "NO";
    t.review.validSetup = i % 5 !== 0;
    t.review.lesson = "Demo data — replace with real trades.";
    out.push(deriveTrade(t));
  }
  return out;
}

/* ---------------------------------------------------------------------
   16. INIT
   --------------------------------------------------------------------- */
async function loadAllData() {
  TRADES = await idbGetAll("trades");
  // Backward compatibility: trades saved before entryExecutionStyle existed have no such
  // property. Treat them as unclassified (null) in memory. Nothing is written back to the
  // database and no historical trade is ever auto-classified or guessed.
  TRADES.forEach(t => { if (t.entryExecutionStyle === undefined) t.entryExecutionStyle = null; });
  PLAYBOOKS = await idbGetAll("playbook");
  REVIEWS = await idbGetAll("weeklyReviews");
  ACCOUNTS = await idbGetAll("accounts");
  let s = await idbGet("kv", "settings");
  if (!s) { s = defaultSettings(); await idbPut("kv", s); }
  SETTINGS = { ...defaultSettings(), ...s, account: { ...defaultSettings().account, ...(s.account||{}) }, journal: { ...defaultSettings().journal, ...(s.journal||{}) }, display: { ...defaultSettings().display, ...(s.display||{}) }, riskControl: { ...defaultSettings().riskControl, ...(s.riskControl||{}) } };
  applyDisplaySettings();
  await migrateAccountsIfNeeded();
}

/* ---------------------------------------------------------------------
   16b. ACCOUNT MIGRATION (idempotent — safe to run on every load)
   Runs only when ACCOUNTS is empty, so it never re-creates an Account
   or re-imports Trades once migration has happened once. Never deletes
   or overwrites existing Trades — only fills in a missing accountId.
   --------------------------------------------------------------------- */
async function migrateAccountsIfNeeded() {
  // Step 1: if no Accounts exist yet, create exactly one from the legacy
  // single-account Settings block so no existing configuration is lost.
  if (ACCOUNTS.length === 0) {
    const legacy = SETTINGS.account || {};
    const migrated = blankAccount({
      name: legacy.accountName || "My Account",
      accountSize: legacy.accountSize || 0,
      startingBalance: legacy.startingBalance || 0,
      profitTarget: legacy.profitTarget || 0,
      maxDrawdown: legacy.maxDrawdown || 0,
      dailyLossLimit: legacy.dailyLossLimit || 0,
      riskPerTrade: legacy.riskPerTrade || 0,
      defaultContract: legacy.defaultContract || "",
      defaultInstrument: legacy.defaultInstrument || ""
    });
    await idbPut("accounts", migrated);
    ACCOUNTS.push(migrated);
  }

  // Step 2: any Trade without a valid accountId (pre-patch Trades, or
  // legacy imports) gets attached to a safe default Account. Existing
  // Trade content is never rewritten beyond adding this one field.
  const fallbackId = getPreferredAccountId();
  const orphans = TRADES.filter(t => !t.accountId || !getAccountById(t.accountId));
  if (orphans.length && fallbackId) {
    for (const t of orphans) {
      t.accountId = fallbackId;
      await idbPut("trades", t);
    }
  }

  // Step 3: make sure a lastAccountId preference is set so New Trade has a sane default.
  if (!SETTINGS.lastAccountId || !getAccountById(SETTINGS.lastAccountId)) {
    const preferred = getPreferredAccountId();
    if (preferred) { SETTINGS.lastAccountId = preferred; await idbPut("kv", SETTINGS); }
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  try {
    await openDB();
    await loadAllData();
  } catch (err) {
    // Last-resort safety net: never leave the user on a stuck loading screen.
    USE_MEMORY_FALLBACK = true;
    try { await loadAllData(); } catch (err2) { /* even the in-memory path failed to init; router() below still renders the shell */ }
  }
  router();
  if (USE_MEMORY_FALLBACK) showStorageFallbackBanner();
});

function showStorageFallbackBanner() {
  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:300;background:var(--amber-dim);color:var(--amber);border-bottom:1px solid var(--border);padding:9px 16px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:12px;";
  bar.innerHTML = `<span>Persistent storage isn't available in this preview, so trades entered here won't be saved after a refresh. Download this file and open it directly in your browser (double-click it, or drag it into a browser tab) for permanent local storage.</span>`;
  const closeBtn = document.createElement("button");
  closeBtn.textContent = "×";
  closeBtn.style.cssText = "background:none;border:none;color:var(--amber);font-size:18px;cursor:pointer;flex-shrink:0;line-height:1;";
  closeBtn.onclick = () => bar.remove();
  bar.appendChild(closeBtn);
  document.body.prepend(bar);
}
