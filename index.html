<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Edge Research System — Trading Journal</title>
<style>
:root{
  --bg:#0A0D12;
  --bg-1:#0F1319;
  --bg-2:#141A22;
  --bg-3:#1B222C;
  --border:#252D38;
  --border-soft:#1C232D;
  --text:#E7EAEE;
  --text-dim:#93A0AF;
  --text-faint:#5C6774;
  --accent:#5B8CFF;
  --accent-dim:#2A3B5C;
  --green:#33D6A0;
  --green-dim:#12332B;
  --red:#FF6B6B;
  --red-dim:#3A1F22;
  --amber:#E8A94D;
  --amber-dim:#3A2E17;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 6px;
  --sidebar-w: 220px;
}
[data-theme="light"]{
  --bg:#F5F6F8;
  --bg-1:#FFFFFF;
  --bg-2:#FFFFFF;
  --bg-3:#EEF0F3;
  --border:#DCE0E6;
  --border-soft:#E7E9ED;
  --text:#141A22;
  --text-dim:#5C6774;
  --text-faint:#93A0AF;
  --accent:#3560E0;
  --accent-dim:#DCE6FF;
  --green:#0F9D6E;
  --green-dim:#DFF6EE;
  --red:#D9403F;
  --red-dim:#FBE3E2;
  --amber:#B5791A;
  --amber-dim:#FBEDD7;
}
[data-compact="1"] .card{padding:12px !important;}
[data-compact="1"] table td, [data-compact="1"] table th{padding:6px 8px !important;}
[data-compact="1"] .field{margin-bottom:8px !important;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-1);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:20px 12px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  padding:4px 10px 20px 10px;
  font-family:var(--mono);
  letter-spacing:0.2px;
}
.brand .b1{font-size:15px;font-weight:600;color:var(--text);}
.brand .b2{font-size:11px;color:var(--text-faint);margin-top:2px;}
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
.navlist a{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius);
  color:var(--text-dim);text-decoration:none;font-size:13.5px;
  border:1px solid transparent;
}
.navlist a svg{width:16px;height:16px;flex-shrink:0;opacity:0.85;}
.navlist a:hover{background:var(--bg-2);color:var(--text);}
.navlist a.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-dim);}
.sidebar-foot{margin-top:auto;padding:10px;font-size:11px;color:var(--text-faint);font-family:var(--mono);}
.bottom-nav{display:none;}
main{flex:1;min-width:0;padding:24px 28px 90px 28px;max-width:1280px;}
h1.page-title{font-size:19px;font-weight:600;margin:0 0 4px 0;}
p.page-sub{color:var(--text-dim);margin:0 0 22px 0;font-size:13px;}
.card{
  background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;
}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
.stat-card{padding:14px 16px;}
.stat-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.4px;}
.stat-value{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px;}
.stat-value.pos{color:var(--green);}
.stat-value.neg{color:var(--red);}
.section-title{font-size:13px;font-weight:600;color:var(--text-dim);margin:26px 0 10px 0;text-transform:none;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;color:var(--text-faint);font-weight:500;font-size:11.5px;
  padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-family:var(--mono);font-size:12.5px;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover td{background:var(--bg-2);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--sans);}
.badge.good-win{background:var(--green-dim);color:var(--green);}
.badge.good-loss{background:var(--accent-dim);color:var(--accent);}
.badge.bad-win{background:var(--amber-dim);color:var(--amber);}
.badge.bad-loss{background:var(--red-dim);color:var(--red);}
.badge.neutral{background:var(--bg-3);color:var(--text-dim);}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-3);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:var(--sans);
}
.btn:hover{border-color:var(--text-faint);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{background:var(--red-dim);border-color:var(--red-dim);color:var(--red);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.field .hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:var(--radius);font-size:13px;font-family:var(--sans);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{min-height:70px;resize:vertical;font-family:var(--sans);}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12.5px;cursor:pointer;
  background:var(--bg-2);color:var(--text-dim);user-select:none;
}
.chip.selected{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.check-row:last-child{border-bottom:none;}
.check-row input[type=checkbox]{margin-top:2px;width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;}
.check-row label{font-size:13px;color:var(--text);cursor:pointer;}
.framework-box{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:var(--bg-2);}
.framework-box .fw-title{font-family:var(--mono);font-size:12.5px;color:var(--accent);margin-bottom:2px;}
.framework-box .fw-sub{font-size:12px;color:var(--text-dim);margin-bottom:10px;font-style:italic;}
.wizard-steps{display:flex;gap:4px;margin-bottom:22px;flex-wrap:wrap;}
.wizard-step{
  flex:1;min-width:80px;text-align:center;padding:8px 4px;font-size:11.5px;color:var(--text-faint);
  border-bottom:2px solid var(--border);cursor:pointer;
}
.wizard-step.active{color:var(--accent);border-color:var(--accent);}
.wizard-step.done{color:var(--text-dim);border-color:var(--green);}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:9px 14px;font-size:13px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--text);border-color:var(--accent);}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:flex-start;justify-content:center;
  padding:4vh 16px;overflow-y:auto;z-index:100;
}
.modal{background:var(--bg-1);border:1px solid var(--border);border-radius:8px;max-width:760px;width:100%;padding:22px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h2{font-size:16px;margin:0;}
.close-x{cursor:pointer;color:var(--text-faint);font-size:20px;background:none;border:none;}
.toast-root{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--bg-3);border:1px solid var(--border);padding:10px 16px;border-radius:var(--radius);font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.3);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-state .big{font-size:14px;color:var(--text-dim);margin-bottom:6px;}
.reminder-strip{
  border:1px solid var(--border-soft);background:var(--bg-2);border-radius:var(--radius);
  padding:10px 14px;font-size:12.5px;color:var(--text-dim);font-style:italic;margin-bottom:18px;
}
.filters-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filters-bar select,.filters-bar input{width:auto;min-width:120px;}
.sample-tag{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--bg-3);color:var(--text-faint);}
.sample-tag.useful{color:var(--green);}
.sample-tag.developing{color:var(--amber);}
.sample-tag.low{color:var(--text-faint);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:800px){.two-col{grid-template-columns:1fr;}}
.thumb-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.thumb{width:74px;height:74px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer;}
.upload-box{border:1px dashed var(--border);border-radius:var(--radius);padding:14px;text-align:center;color:var(--text-faint);font-size:12px;cursor:pointer;}
.divider{height:1px;background:var(--border);margin:20px 0;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.kv .k{color:var(--text-dim);}
.kv .v{font-family:var(--mono);}
.progress-note{font-size:12px;color:var(--text-faint);margin-top:-10px;margin-bottom:16px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
@media(max-width:880px){
  .sidebar{display:none;}
  main{padding:16px 14px 90px 14px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg-1);
    border-top:1px solid var(--border);z-index:50;justify-content:space-around;padding:6px 0;
  }
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-faint);text-decoration:none;font-size:10px;padding:4px 6px;}
  .bottom-nav a.active{color:var(--accent);}
  .bottom-nav svg{width:18px;height:18px;}
  .grid-4,.grid-3{grid-template-columns:1fr 1fr;}
}
/* ==== ADDED: Framework Configuration Editor styles (additive only) ==== */
.fw-cfg-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--bg-2);margin-bottom:6px;}
.fw-cfg-item.disabled{opacity:0.5;}
.fw-cfg-item .grow{flex:1;min-width:0;}
.fw-cfg-item .lbl{font-size:13px;}
.fw-cfg-item .meta{font-size:11px;color:var(--text-faint);font-family:var(--mono);}
.fw-cfg-item .ord-btns{display:flex;flex-direction:column;gap:2px;}
.fw-cfg-item .ord-btns button{padding:0 6px;font-size:11px;line-height:1.4;}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-family:var(--sans);font-weight:600;}
.pill.req{background:var(--accent-dim);color:var(--accent);}
.pill.opt{background:var(--bg-3);color:var(--text-faint);}
.pill.ver{background:var(--green-dim);color:var(--green);}
.pill.draft{background:var(--amber-dim);color:var(--amber);}
.pill.locked{background:var(--bg-3);color:var(--text-dim);}
</style>
</head>
<body data-theme="dark" data-compact="0">
<div id="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand"><div class="b1">EDGE RESEARCH</div><div class="b2">Personal Trading System</div></div>
    <ul class="navlist" id="navlist"></ul>
    <div class="sidebar-foot">v1.0 · local-first</div>
  </nav>
  <main id="main-content"></main>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>

<script>
/* =========================================================================
   EDGE RESEARCH SYSTEM — TRADING JOURNAL
   Single-file local-first application (IndexedDB persistence)

   FRAMEWORK UPDATE (Configuration-Driven + Versioning)
   ---------------------------------------------------------------------
   This build PATCHES the original app. The old hard-coded FRAMEWORK const
   has been replaced by a configuration-driven layer (FRAMEWORK_CONFIG /
   FrameworkVersion) while every non-framework subsystem — IndexedDB,
   Journal, Risk, Analytics, Import/Export, Accounts, Review, Playbook —
   is preserved. Historical trades keep the exact framework data recorded
   at the time; nothing old is reclassified or rewritten.
   ========================================================================= */

/* ---------------------------------------------------------------------
   1. FRAMEWORK CONFIGURATION — CONFIGURATION-DRIVEN (replaces old const)
   ---------------------------------------------------------------------
   LAYER 1 (Configuration): the data below is only the *seed* for the
   default published Framework Version. At runtime the active configuration
   lives in ACTIVE_FRAMEWORK (a FrameworkVersion.config object) loaded from
   IndexedDB, and can be edited by the user in Settings → Framework without
   any Core-Engine code change.

   Every entity carries a STABLE id (never the array index), plus
   enabled / order, and — for checklist items — required. The Core Engine
   reads these generically:  requiredItems.every(i => checked[i.id] === true)
   --------------------------------------------------------------------- */

// Small stable-id helper for seeded config (deterministic, readable ids).
function _cid(prefix, n) { return prefix + "_" + n; }

// ---- DAILY BIAS MODELS (new spec: Reversal / C2 Cont / C3 Cont / Invalidation of EQ)
const SEED_BIAS_MODELS = [
  {
    id: "bias_reversal", name: "Reversal", enabled: true, order: 1,
    description: "[POI or Numbering Phase + PDH/L Sweep]",
    checklist: [
      { id: "rv_1", label: "On POI or Numbering Phase", enabled: true, required: true, order: 1 },
      { id: "rv_2", label: "Sweep PDH/L first", enabled: true, required: true, order: 2 },
      { id: "rv_3", label: "Asia slowly forms Protected Swing", enabled: true, required: true, order: 3 },
      { id: "rv_4", label: "Opposite 1H CISD", enabled: true, required: true, order: 4 },
      { id: "rv_5", label: "1H Closure [V-shape]", enabled: true, required: true, order: 5 },
      { id: "rv_6", label: "Target : EQ", enabled: true, required: true, order: 6 }
    ]
  },
  {
    id: "bias_c2_continuation", name: "C2 Continuations", enabled: true, order: 2,
    description: "C2 Valid Closure",
    checklist: [
      { id: "c2_1", label: "Previous Day: C2 Closure confirm with \"1h CISD confirm\" in C2 + Wick reject Closure", enabled: true, required: true, order: 1 },
      { id: "c2_2", label: "C3 Open: forms Wick in Validation Zone first", enabled: true, required: true, order: 2 },
      { id: "c2_3", label: "In Validation Zone: Respect EQ", enabled: true, required: true, order: 3 },
      { id: "c2_4", label: "Target: PDH/L, PWH/L", enabled: true, required: true, order: 4 }
    ]
  },
  {
    id: "bias_c3_continuation", name: "C3 Continuations", enabled: true, order: 3,
    description: "C3 Valid Closure",
    checklist: [
      { id: "c3_1", label: "Previous Day C2 Fail \"1h CISD\": C3 Closure confirm with \"1h CISD confirm\" in C3", enabled: true, required: true, order: 1 },
      { id: "c3_2", label: "In Validation Zone: Respect EQ", enabled: true, required: true, order: 2 },
      { id: "c3_3", label: "Target: PDH/L, PWH/L", enabled: true, required: true, order: 3 }
    ]
  },
  {
    id: "bias_invalidation_eq", name: "Invalidation of EQ", enabled: true, order: 4,
    description: "Price disrespected EQ",
    checklist: [
      { id: "iv_1", label: "Day open: Mitigated on Invalidation Zone [EQ]", enabled: true, required: true, order: 1 },
      { id: "iv_2", label: "1h disrespect on first time touch: 1h consolidation", enabled: true, required: true, order: 2 },
      { id: "iv_3", label: "POI opposite: Swing 1h CISD Closure [Manipulation] OR 1h CISD Closure [Breakout EQ] in invalidation zone", enabled: true, required: true, order: 3 },
      { id: "iv_4", label: "Target: PDH/L", enabled: true, required: true, order: 4 }
    ]
  }
];

// ---- C2 INTRADAY research layer (NEW)
const SEED_C2_POI = [
  { id: "poi_fvg", label: "FVG", enabled: true, order: 1 },
  { id: "poi_swing", label: "Swing Point", enabled: true, order: 2 },
  { id: "poi_ob", label: "Order Block", enabled: true, order: 3 },
  { id: "poi_smt", label: "SMT", enabled: true, order: 4 },
  { id: "poi_c2_4h", label: "C2 of 4h [No POI]", enabled: true, order: 5 }
];
const SEED_C2_TF = [
  { id: "tf_0200", label: "02:00", enabled: true, order: 1 },
  { id: "tf_0300", label: "03:00 — for LD 5m CISD at POI", enabled: true, order: 2 },
  { id: "tf_0400", label: "04:00 — for LD 5m CISD at POI", enabled: true, order: 3 },
  { id: "tf_0500", label: "05:00 — for LD 5m CISD at POI", enabled: true, order: 4 },
  { id: "tf_0600", label: "06:00", enabled: true, order: 5 },
  { id: "tf_0700", label: "07:00 — for NY", enabled: true, order: 6 },
  { id: "tf_0800", label: "08:00 — for NY", enabled: true, order: 7 },
  { id: "tf_0900", label: "09:00 — for NY", enabled: true, order: 8 },
  { id: "tf_1000", label: "10:00", enabled: true, order: 9 },
  { id: "tf_1400", label: "14:00", enabled: true, order: 10 },
  { id: "tf_1800", label: "18:00", enabled: true, order: 11 },
  { id: "tf_2200", label: "22:00", enabled: true, order: 12 }
];
const SEED_C2_SCENARIOS = [
  { id: "scn_reversal", label: "Reversal [C2 Small Wick]", enabled: true, order: 1 },
  { id: "scn_cont_c2", label: "Continuation C2 Closure [C2 Large Wick]", enabled: true, order: 2 },
  { id: "scn_cont_c3", label: "Continuation C3 Closure [C3 EQ validation zone]", enabled: true, order: 3 }
];

// ---- ENTRY MODEL = TRIGGER (same thing, kept under the name "Trigger" in UI)
// Session-specific checklists per the new spec. Replaces the old trigger set.
const SEED_TRIGGER_SESSIONS = [
  {
    id: "sess_asia", name: "Asia", enabled: true, order: 1,
    checklist: [
      { id: "as_1", label: "Previous Day Closes make 4h Closure [Continuation] | Asia breakout PCH/L [Reversal]", enabled: true, required: true, order: 1 },
      { id: "as_2", label: "4h Closure confirm C2 on Time [14:00, 18:00]", enabled: true, required: true, order: 2 },
      { id: "as_3", label: "1h CISD Closure : Entry", enabled: true, required: true, order: 3 }
    ]
  },
  {
    id: "sess_london", name: "London", enabled: true, order: 2,
    checklist: [
      { id: "ld_1", label: "Asia Accumulation > LD Manipulation on Time", enabled: true, required: true, order: 1 },
      { id: "ld_2", label: "4h, 1h Closure confirm C2 on Time [22:00, 02:00, 03:00, 04:00, 05:00]", enabled: true, required: true, order: 2 },
      { id: "ld_3", label: "15m, 5m CISD Closure : Entry", enabled: true, required: true, order: 3 }
    ]
  },
  {
    id: "sess_ny", name: "NY", enabled: true, order: 3,
    checklist: [
      { id: "ny_1", label: "Asia, LD : Accumulation", enabled: true, required: true, order: 1 },
      { id: "ny_2", label: "4h, 1h Closure confirm C2 on Time [06:00, 07:00, 08:00, 09:00]", enabled: true, required: true, order: 2 },
      { id: "ny_3", label: "5m CISD Closure : Entry", enabled: true, required: true, order: 3 }
    ]
  }
];

// A full Framework Configuration snapshot (the payload of a FrameworkVersion).
function seedFrameworkConfig() {
  return {
    biasModels: JSON.parse(JSON.stringify(SEED_BIAS_MODELS)),
    c2Intraday: {
      poiOptions: JSON.parse(JSON.stringify(SEED_C2_POI)),
      tfOptions: JSON.parse(JSON.stringify(SEED_C2_TF)),
      scenarios: JSON.parse(JSON.stringify(SEED_C2_SCENARIOS))
    },
    triggerSessions: JSON.parse(JSON.stringify(SEED_TRIGGER_SESSIONS))
  };
}

// A FrameworkVersion record. status: "draft" | "published" | "locked".
function makeFrameworkVersion(version, status, config) {
  const now = new Date().toISOString();
  return {
    id: "fw_" + uuid(),
    version: version,
    status: status || "published",
    config: config || seedFrameworkConfig(),
    createdAt: now,
    publishedAt: status === "published" || status === "locked" ? now : null
  };
}

/* Runtime pointers set during init:
   FRAMEWORK_VERSIONS : all versions (array)

function _byOrder(a, b) { return (a.order || 0) - (b.order || 0); }
function activeConfig() { return ACTIVE_FRAMEWORK ? ACTIVE_FRAMEWORK.config : seedFrameworkConfig(); }
function activeBiasModels() { return activeConfig().biasModels.filter(m => m.enabled).slice().sort(_byOrder); }
function activePOIOptions() { return activeConfig().c2Intraday.poiOptions.filter(o => o.enabled).slice().sort(_byOrder); }

function activeTriggerSessions() { return activeConfig().triggerSessions.filter(s => s.enabled).slice().sort(_byOrder); }
function enabledChecklist(item) { return (item.checklist || []).filter(c => c.enabled).slice().sort(_byOrder); }
function requiredChecklist(item) { return (item.checklist || []).filter(c => c.enabled && c.required).slice().sort(_byOrder); }

// Resolve helpers that search a given config snapshot (so historical versions work too).
function findBiasModelInConfig(config, modelId) {
  if (!config) return null;
  return config.biasModels.find(m => m.id === modelId) || null;
}
function findTriggerSessionInConfig(config, sessionId) {
  if (!config) return null;
  return config.triggerSessions.find(s => s.id === sessionId) || null;
}
function frameworkVersionById(id) { return FRAMEWORK_VERSIONS.find(v => v.id === id) || null; }
// The config that a trade was recorded under. Falls back to active for legacy trades.
function configForTrade(trade) {
  if (trade.frameworkVersionId) {
    const v = frameworkVersionById(trade.frameworkVersionId);
    if (v) return v.config;
  }
  return null; // legacy trade — caller uses the trade's own stored labels
}

// Model is confirmed only when ALL enabled+required checklist items are checked.
// No thresholds, no percentages, no evidence counts.
function isBiasModelConfirmed(model, checkedMap) {
  const req = requiredChecklist(model);
  if (!req.length) return false;
  return req.every(c => checkedMap && checkedMap[c.id] === true);
}
function isTriggerSessionConfirmed(session, checkedMap) {
  const req = requiredChecklist(session);
  if (!req.length) return false;
  return req.every(c => checkedMap && checkedMap[c.id] === true);
}

/* ---------------------------------------------------------------------
   2. INDEXEDDB LAYER
   --------------------------------------------------------------------- */
const DB_NAME = "edgeResearchDB";
const DB_VERSION = 3; // v3: added "framework" store (Framework Configuration + Versions). v2 stores untouched on upgrade.
let dbInstance = null;
let USE_MEMORY_FALLBACK = false; // true when IndexedDB is unavailable/blocked/hangs (e.g. sandboxed preview)

// In-memory fallback store — same shape/keys as the IndexedDB stores. Used only when
// real IndexedDB cannot be opened, so the app still loads and works (data just won't
// persist across a reload in that specific environment).
const MEM_STORE = { trades: new Map(), playbook: new Map(), weeklyReviews: new Map(), kv: new Map(), accounts: new Map(), framework: new Map() };
const MEM_KEYPATH = { trades: "tradeId", playbook: "id", weeklyReviews: "id", kv: "key", accounts: "id", framework: "id" };

function openDB() {
  return new Promise((resolve) => {
    if (typeof indexedDB === "undefined" || !indexedDB) { USE_MEMORY_FALLBACK = true; resolve(null); return; }
    let settled = false;
    // Some sandboxed/embedded preview contexts silently hang on indexedDB.open() instead
    // of firing onerror. A timeout guarantees the app always finishes loading either way.
    const timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      USE_MEMORY_FALLBACK = true;
      resolve(null);
    }, 2500);
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("trades")) db.createObjectStore("trades", { keyPath: "tradeId" });
        if (!db.objectStoreNames.contains("playbook")) db.createObjectStore("playbook", { keyPath: "id" });
        if (!db.objectStoreNames.contains("weeklyReviews")) db.createObjectStore("weeklyReviews", { keyPath: "id" });
        if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv", { keyPath: "key" });
        if (!db.objectStoreNames.contains("accounts")) db.createObjectStore("accounts", { keyPath: "id" });
        if (!db.objectStoreNames.contains("framework")) db.createObjectStore("framework", { keyPath: "id" });
      };
      req.onsuccess = (e) => {
        if (settled) return;
        settled = true; clearTimeout(timeoutId);
        dbInstance = e.target.result;
        resolve(dbInstance);
      };
      req.onerror = () => {
        if (settled) return;
        settled = true; clearTimeout(timeoutId);
        USE_MEMORY_FALLBACK = true;
        resolve(null);
      };
      req.onblocked = () => { /* left to the timeout above */ };
    } catch (err) {
      clearTimeout(timeoutId);
      USE_MEMORY_FALLBACK = true;
      resolve(null);
    }
  });
}

function tx(storeName, mode) {
  return dbInstance.transaction(storeName, mode).objectStore(storeName);
}
function idbGetAll(storeName) {
  if (USE_MEMORY_FALLBACK) return Promise.resolve(Array.from(MEM_STORE[storeName].values()));
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readonly").getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(storeName, key) {
  if (USE_MEMORY_FALLBACK) return Promise.resolve(MEM_STORE[storeName].has(key) ? MEM_STORE[storeName].get(key) : null);
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readonly").get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function idbPut(storeName, value) {
  if (USE_MEMORY_FALLBACK) {
    const kp = MEM_KEYPATH[storeName];
    MEM_STORE[storeName].set(value[kp], value);
    return Promise.resolve(value);
  }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readwrite").put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}
function idbDelete(storeName, key) {
  if (USE_MEMORY_FALLBACK) { MEM_STORE[storeName].delete(key); return Promise.resolve(); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readwrite").delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function idbClear(storeName) {
  if (USE_MEMORY_FALLBACK) { MEM_STORE[storeName].clear(); return Promise.resolve(); }
  return new Promise((resolve, reject) => {
    const req = tx(storeName, "readwrite").clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtNum(n, digits = 2) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toFixed(digits);
}
function fmtCurrency(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtR(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const sign = n > 0 ? "+" : "";
  return sign + Number(n).toFixed(2) + "R";
}
function fmtPF(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  if (n === Infinity) return "∞";
  return fmtNum(n);
}
function fmtPct(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toFixed(1) + "%";
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function nowTimeStr() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsText(file);
  });
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function toast(msg) {
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function csvEscape(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

/* ---------------------------------------------------------------------
   6. CALCULATION ENGINE (unchanged — process vs outcome separation kept)
   --------------------------------------------------------------------- */
function computeExecutionTotal(er) {
  const c = Number(er.contextScore) || 0;
  const f = Number(er.frameworkScore) || 0;
  const e = Number(er.entryScore) || 0;
  const r = Number(er.riskScore) || 0;
  const m = Number(er.managementScore) || 0;
  return c + f + e + r + m;
}

function computeClassification(trade) {
  const finalR = Number(trade.management.finalR);
  const hasResult = trade.management.finalR !== "" && trade.management.finalR !== null && !isNaN(finalR);
  const frameworkValid = trade.review.validSetup === true;
  const ruleBreak = trade.executionReview.ruleBreak === "YES";
  const totalScore = computeExecutionTotal(trade.executionReview);
  const goodExecution = totalScore >= (SETTINGS?.goodExecutionThreshold || 70) && !ruleBreak;

  const cls = { goodWin: false, goodLoss: false, badWin: false, badLoss: false, label: "" };
  if (!hasResult) { cls.label = "PENDING"; return cls; }
  if (finalR === 0) { cls.label = "BREAKEVEN"; return cls; }

  const isWin = finalR > 0;
  const isGoodProcess = frameworkValid && goodExecution;

  if (isGoodProcess && isWin) { cls.goodWin = true; cls.label = "GOOD WIN"; }
  else if (isGoodProcess && !isWin) { cls.goodLoss = true; cls.label = "GOOD LOSS"; }
  else if (!isGoodProcess && isWin) { cls.badWin = true; cls.label = "BAD WIN"; }
  else { cls.badLoss = true; cls.label = "BAD LOSS"; }
  return cls;
}

function deriveTrade(trade) {
  trade.executionReview.totalScore = computeExecutionTotal(trade.executionReview);
  trade.framework.frameworkValid = trade.review.validSetup;
  trade.classification = computeClassification(trade);
  trade.updatedAt = new Date().toISOString();
  return trade;
}

function tradeResultType(trade) {
  const fr = Number(trade.management.finalR);
  if (trade.management.finalR === "" || trade.management.finalR === null || isNaN(fr)) return "pending";
  if (fr > 0) return "win";
  if (fr < 0) return "loss";
  return "breakeven";
}

/* Aggregate statistics over an array of trades (closed trades only unless noted) */
function computeAggregateStats(trades) {
  const closed = trades.filter(t => tradeResultType(t) === "win" || tradeResultType(t) === "loss" || tradeResultType(t) === "breakeven");
  const wins = closed.filter(t => tradeResultType(t) === "win");
  const losses = closed.filter(t => tradeResultType(t) === "loss");
  const n = closed.length;
  const winRate = n ? (wins.length / n) * 100 : 0;
  const lossRate = n ? (losses.length / n) * 100 : 0;
  const avgWinR = wins.length ? wins.reduce((s, t) => s + Number(t.management.finalR), 0) / wins.length : 0;
  const avgLossR = losses.length ? Math.abs(losses.reduce((s, t) => s + Number(t.management.finalR), 0) / losses.length) : 0;
  const expectancy = (winRate / 100) * avgWinR - (lossRate / 100) * avgLossR;
  const grossWinR = wins.reduce((s, t) => s + Number(t.management.finalR), 0);
  const grossLossR = Math.abs(losses.reduce((s, t) => s + Number(t.management.finalR), 0));
  const profitFactor = grossLossR > 0 ? grossWinR / grossLossR : (grossWinR > 0 ? Infinity : NaN);
  const netR = closed.reduce((s, t) => s + (Number(t.management.finalR) || 0), 0);
  const netPnL = closed.reduce((s, t) => s + (Number(t.management.finalPnL) || 0), 0);
  const avgR = n ? netR / n : 0;
  const avgExecution = trades.length ? trades.reduce((s, t) => s + (Number(t.executionReview.totalScore) || 0), 0) / trades.length : 0;
  const validCount = trades.filter(t => t.review.validSetup === true).length;
  const frameworkCompliance = trades.length ? (validCount / trades.length) * 100 : 0;

  const chron = [...closed].sort((a, b) => new Date(a.date + "T" + (a.time || "00:00")) - new Date(b.date + "T" + (b.time || "00:00")));
  let equity = 0, peak = 0, maxDD = 0;
  let curStreak = 0, curType = null, winStreak = 0, lossStreak = 0;
  chron.forEach(t => {
    const r = Number(t.management.finalR) || 0;
    equity += r;
    if (equity > peak) peak = equity;
    const dd = peak - equity;
    if (dd > maxDD) maxDD = dd;
    const rt = tradeResultType(t);
    if (rt === curType) { curStreak++; } else { curStreak = 1; curType = rt; }
    if (rt === "win") winStreak = Math.max(winStreak, curStreak);
    if (rt === "loss") lossStreak = Math.max(lossStreak, curStreak);
  });

  return {
    totalTrades: trades.length,
    closedTrades: n,
    winRate, lossRate, avgWinR, avgLossR, expectancy, profitFactor,
    netR, netPnL, avgR, avgExecution, frameworkCompliance,
    maxDrawdownR: maxDD, winStreak, lossStreak
  };
}

function sampleSizeLabel(n) {
  if (n >= 100) return { label: "Stronger Evidence", cls: "useful" };
  if (n >= 50) return { label: "Useful Sample", cls: "useful" };
  if (n >= 30) return { label: "Developing Sample", cls: "developing" };
  if (n >= 10) return { label: "Low Sample", cls: "low" };
  return { label: "Very Low Sample", cls: "low" };
}

function groupTrades(trades, keyFn) {
  const map = new Map();
  trades.forEach(t => {
    const k = keyFn(t);
    if (k === null || k === undefined || k === "") return;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(t);
  });
  const out = [];
  map.forEach((list, key) => {
    out.push({ key, trades: list, stats: computeAggregateStats(list), sample: sampleSizeLabel(list.length) });
  });
  return out;
}

/* ---------------------------------------------------------------------
   6b. FRAMEWORK DISPLAY HELPERS (resolve stable ids -> human labels)
   ---------------------------------------------------------------------
   These make analytics/journal robust across framework versions and for
   legacy trades. Priority: the trade's stored snapshot name -> the trade's
   own framework-version config -> the active config -> legacy free text.
   --------------------------------------------------------------------- */
function tradeBiasLabel(t) {
  if (t.framework && t.framework.biasName) return t.framework.biasName;
  const cfg = configForTrade(t);
  if (cfg && t.framework && t.framework.biasModelId) {
    const m = findBiasModelInConfig(cfg, t.framework.biasModelId);
    if (m) return m.name;
  }
  if (t.framework && t.framework.biasModelId) {
    const m = findBiasModelInConfig(activeConfig(), t.framework.biasModelId);
    if (m) return m.name;
  }
  // legacy free-text bias
  return (t.framework && t.framework.bias) ? t.framework.bias : "";
}
function tradeTriggerLabel(t) {
  if (t.framework && t.framework.triggerName) return t.framework.triggerName;
  const cfg = configForTrade(t);
  if (cfg && t.framework && t.framework.triggerSessionId) {
    const s = findTriggerSessionInConfig(cfg, t.framework.triggerSessionId);
    if (s) return s.name;
  }
  if (t.framework && t.framework.triggerSessionId) {
    const s = findTriggerSessionInConfig(activeConfig(), t.framework.triggerSessionId);
    if (s) return s.name;
  }
  return (t.framework && t.framework.trigger) ? t.framework.trigger : "";

// Resolve a POI id -> label using the trade's version config, then active, then id itself.
function poiLabel(t, poiId) {
  const cfg = configForTrade(t) || activeConfig();
  const found = cfg.c2Intraday.poiOptions.find(o => o.id === poiId)
    || activeConfig().c2Intraday.poiOptions.find(o => o.id === poiId);

}
function tfLabel(t, tfId) {
  if (!tfId) return "";
  const cfg = configForTrade(t) || activeConfig();
  const found = cfg.c2Intraday.tfOptions.find(o => o.id === tfId)
    || activeConfig().c2Intraday.tfOptions.find(o => o.id === tfId);
  return found ? found.label : tfId;
}
function scenarioLabel(t, scnId) {
  if (!scnId) return "";

function renderSparkline(points) {
  const w = 900, h = 180, pad = 20;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rangeY = (maxY - minY) || 1;
  const maxX = Math.max(...xs) || 1;
  const path = points.map((p, i) => {
    const x = pad + (p.x / maxX) * (w - pad * 2);
    const y = h - pad - ((p.y - minY) / rangeY) * (h - pad * 2);
    return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  const last = points[points.length - 1];
  const color = last.y >= points[0].y ? "var(--green)" : "var(--red)";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:180px;">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
  </svg>`;
}

function bindStep3() {
  const t = wizardTrade;
  const recalc = () => {
    const entry = Number(t.execution.entry), sl = Number(t.execution.stopLoss), target = Number(t.execution.target);
    const contracts = Number(t.execution.contracts) || 0, pv = Number(t.execution.pointValue) || 1;
    let riskCalc = null, rewardCalc = null, rr = null;
    if (!isNaN(entry) && !isNaN(sl) && contracts) riskCalc = Math.abs(entry - sl) * contracts * pv;
    if (!isNaN(entry) && !isNaN(target) && contracts) rewardCalc = Math.abs(target - entry) * contracts * pv;
    if (riskCalc && rewardCalc) rr = rewardCalc / riskCalc;
    document.getElementById("calcRisk").textContent = riskCalc !== null ? fmtCurrency(riskCalc) : "—";
    document.getElementById("calcReward").textContent = rewardCalc !== null ? fmtCurrency(rewardCalc) : "—";
    document.getElementById("calcRR").textContent = rr !== null ? fmtNum(rr) + " : 1" : "—";
    t.execution.plannedRR = rr !== null ? rr.toFixed(2) : "";
    if (!t.execution.risk && riskCalc !== null) t.execution.risk = riskCalc.toFixed(2);
    const warnEl = document.getElementById("riskWarning");
    const maxRisk = Number(SETTINGS.riskControl.maxRiskAmount);
    const effectiveRisk = Number(t.execution.risk) || riskCalc;
    if (SETTINGS.riskControl.enforceMaxRisk && maxRisk && effectiveRisk && effectiveRisk > maxRisk) {
      warnEl.innerHTML = `<div class="hint" style="color:var(--red);margin-top:10px;">WARNING: Risk exceeds configured maximum (${fmtCurrency(maxRisk)}).</div>`;
    } else { warnEl.innerHTML = ""; }
  };
  ["entry","stopLoss","target","contracts","pointValue","risk"].forEach(f => {
    const id = "f_" + (f === "stopLoss" ? "sl" : f);
    document.getElementById(id).oninput = e => { t.execution[f] = e.target.value; recalc(); };
  });
  document.getElementById("f_actualRR").oninput = e => t.execution.actualRR = e.target.value;
  recalc();
}

function classificationBadgePreview(t) {

async function saveWizardTrade() {
  if (!wizardTrade.accountId) {
    toast("Please select an Account before saving.");
    wizardStep = 0; renderWizardSteps(); renderWizardStepBody();
    return;
  }
  deriveTrade(wizardTrade);
  await persistTrade(wizardTrade);
  toast("Trade saved to Journal.");
  wizardTrade = null; wizardEditingId = null; wizardStep = 0;
  location.hash = "#/journal";
}
async function persistTrade(trade) {
  deriveTrade(trade);
  await idbPut("trades", trade);
  const idx = TRADES.findIndex(t => t.tradeId === trade.tradeId);
  if (idx >= 0) TRADES[idx] = trade; else TRADES.push(trade);
}
/* ---------------------------------------------------------------------

   PATCH: bias/trigger filters now list ACTIVE framework model/session names
   (plus any legacy label found in existing trades, so old trades stay

function biasFilterOptions() {
  const set = new Set(activeConfig().biasModels.map(m => m.name));

  return Array.from(set);

function applyJournalFilters(list) {
  return list.filter(t => {
    if (journalFilters.account && t.accountId !== journalFilters.account) return false;
    if (journalFilters.entryStyle === "Unclassified" && t.entryExecutionStyle) return false;
    if (journalFilters.entryStyle && journalFilters.entryStyle !== "Unclassified" && t.entryExecutionStyle !== journalFilters.entryStyle) return false;
    if (journalFilters.session && t.session !== journalFilters.session) return false;
    if (journalFilters.instrument && !t.instrument.toLowerCase().includes(journalFilters.instrument.toLowerCase())) return false;
    if (journalFilters.direction && t.direction !== journalFilters.direction) return false;
    if (journalFilters.bias && tradeBiasLabel(t) !== journalFilters.bias) return false;
    if (journalFilters.trigger && tradeTriggerLabel(t) !== journalFilters.trigger) return false;
    if (journalFilters.frameworkValid === "valid" && t.review.validSetup !== true) return false;
    if (journalFilters.frameworkValid === "invalid" && t.review.validSetup !== false) return false;
    if (journalFilters.classification && t.classification.label !== journalFilters.classification) return false;
    if (journalFilters.from && t.date < journalFilters.from) return false;
    if (journalFilters.to && t.date > journalFilters.to) return false;
    if (journalFilters.search) {
      const s = journalFilters.search.toLowerCase();
      const hay = [t.instrument, t.notes, t.review.lesson, t.review.nextTime].join(" ").toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });
}

function applyEntryStyleFilter(list) {
  if (!analyticsEntryStyle) return list;
  if (analyticsEntryStyle === "Unclassified") return list.filter(t => !t.entryExecutionStyle);
  return list.filter(t => t.entryExecutionStyle === analyticsEntryStyle);
}

// POI is multi-select: build groups by exploding each trade into its POIs.
// A trade with [FVG, SMT] contributes to BOTH the FVG group and the SMT group.
function poiExplodedGroups(trades) {
  const map = new Map(); // label -> trades[]
  trades.forEach(t => {
    const ids = (t.c2Intraday && Array.isArray(t.c2Intraday.whichPOI)) ? t.c2Intraday.whichPOI : [];
    if (!ids.length) return;
    ids.forEach(id => {
      const label = poiLabel(t, id);
      if (!map.has(label)) map.set(label, []);
      map.get(label).push(t);
    });
  });
  const out = [];
  map.forEach((list, key) => out.push({ key, trades: list, stats: computeAggregateStats(list), sample: sampleSizeLabel(list.length) }));
  return out;
}
// POI combination (exact set) — preserves research value of combinations like FVG+SMT.
function poiComboGroups(trades) {
  return groupTrades(trades, t => {
    const ids = (t.c2Intraday && Array.isArray(t.c2Intraday.whichPOI)) ? t.c2Intraday.whichPOI.slice() : [];
    if (!ids.length) return "";
    return ids.map(id => poiLabel(t, id)).sort().join(" + ");
  });
}

        ${Object.keys(DIMENSIONS).map(k => `<div class="chip ${edgeMatrixDims.includes(k)?'selected':''}" data-dim="${k}">${DIMENSIONS[k].label}</div>`).join("")}
        <div class="chip ${edgeMatrixDims.includes('poi')?'selected':''}" data-dim="poi">Which POI (exploded)</div>
      </div>
      <div class="divider"></div>
      <div id="matrixResults"></div>
    </div>
  `;
  document.querySelectorAll("#matrixDims .chip").forEach(chip => {
    chip.onclick = () => {
      const k = chip.dataset.dim;
      const idx = edgeMatrixDims.indexOf(k);
      if (idx >= 0) edgeMatrixDims.splice(idx, 1);
      else if (edgeMatrixDims.length < 3) edgeMatrixDims.push(k);
      renderAnalytics(main);
    };
  });
  document.getElementById("analyticsAccountFilter").onchange = e => { analyticsAccountId = e.target.value; renderAnalytics(main); };
  document.getElementById("analyticsEntryStyleFilter").onchange = e => { analyticsEntryStyle = e.target.value; renderAnalytics(main); };
  renderMatrixResults();
}

function edgeTable(groups, order) {
  if (!groups.length) return '<div class="empty-state">No data yet.</div>';
  if (order) groups.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  else groups.sort((a, b) => b.stats.expectancy - a.stats.expectancy);
  return `<table>
    <thead><tr><th>Group</th><th>Trades</th><th>Win Rate</th><th>Avg R</th><th>Expectancy</th><th>Profit Factor</th><th>Avg Execution</th><th>Sample</th></tr></thead>
    <tbody>
    ${groups.map(g => `
      <tr>
        <td style="white-space:normal;">${esc(g.key)}</td>
        <td>${g.trades.length}</td>
        <td>${fmtPct(g.stats.winRate)}</td>
        <td class="${g.stats.avgR>=0?'pos':'neg'}">${fmtR(g.stats.avgR)}</td>
        <td class="${g.stats.expectancy>=0?'pos':'neg'}">${fmtR(g.stats.expectancy)}</td>
        <td>${fmtPF(g.stats.profitFactor)}</td>
        <td>${fmtNum(g.stats.avgExecution,1)}</td>
        <td><span class="sample-tag ${g.sample.cls}">${g.sample.label} (${g.trades.length})</span></td>
      </tr>`).join("")}
    </tbody>
  </table>`;
}

function entryStyleTable(trades) {
  const groups = [
    { key: "All Trades", trades: trades },
    { key: "Aggressive", trades: trades.filter(t => t.entryExecutionStyle === "Aggressive") },
    { key: "Conservative", trades: trades.filter(t => t.entryExecutionStyle === "Conservative") },
    { key: "Unclassified", trades: trades.filter(t => !t.entryExecutionStyle) }
  ];
  if (!trades.length) return '<div class="empty-state">No data yet.</div>';
  return `<table>
    <thead><tr>
      <th>Group</th><th>n</th><th>Win Rate</th><th>Loss Rate</th><th>Total R</th><th>Avg R</th>
      <th>Avg Win R</th><th>Avg Loss R</th><th>Expectancy</th><th>Profit Factor</th>
      <th>Max Win Streak</th><th>Max Loss Streak</th><th>Sample</th>
    </tr></thead>
    <tbody>
    ${groups.map(g => {
      const n = g.trades.length;
      if (!n) {
        return `<tr><td>${esc(g.key)}</td><td>0</td><td colspan="11" style="color:var(--text-faint);white-space:normal;">No classified trades</td></tr>`;
      }
      const s = computeAggregateStats(g.trades);
      const sample = sampleSizeLabel(n);
      return `<tr>
        <td>${esc(g.key)}</td>
        <td>${n}</td>
        <td>${fmtPct(s.winRate)}</td>
        <td>${fmtPct(s.lossRate)}</td>
        <td class="${s.netR>=0?'pos':'neg'}">${fmtR(s.netR)}</td>
        <td class="${s.avgR>=0?'pos':'neg'}">${fmtR(s.avgR)}</td>
        <td>${fmtR(s.avgWinR)}</td>
        <td>-${fmtNum(s.avgLossR)}R</td>
        <td class="${s.expectancy>=0?'pos':'neg'}">${fmtR(s.expectancy)}</td>
        <td>${fmtPF(s.profitFactor)}</td>
        <td>${s.winStreak}</td>
        <td>${s.lossStreak}</td>
        <td><span class="sample-tag ${sample.cls}">${sample.label}</span></td>
      </tr>`;
    }).join("")}
    </tbody>
  </table>`;
}

function triggerByEntryStyleTable(trades) {
  const triggerGroups = groupTrades(trades, DIMENSIONS.trigger.fn);
  if (!triggerGroups.length) return '<div class="empty-state">No data yet.</div>';
  triggerGroups.sort((a, b) => String(a.key).localeCompare(String(b.key)));
  const cell = (list) => {
    if (!list.length) return `<td colspan="4" style="color:var(--text-faint);">—</td>`;
    const s = computeAggregateStats(list);
    return `<td>${list.length}</td>
      <td>${fmtPct(s.winRate)}</td>
      <td class="${s.avgR>=0?'pos':'neg'}">${fmtR(s.avgR)}</td>
      <td class="${s.expectancy>=0?'pos':'neg'}">${fmtR(s.expectancy)}</td>`;
  };
  return `<table>
    <thead>
      <tr>
        <th rowspan="2" style="vertical-align:bottom;">Trigger</th>
        <th colspan="4" style="border-bottom:none;">Aggressive</th>
        <th colspan="4" style="border-bottom:none;">Conservative</th>
        <th rowspan="2" style="vertical-align:bottom;">Unclassified</th>
      </tr>
      <tr>
        <th>n</th><th>Win Rate</th><th>Avg R</th><th>Expectancy</th>
        <th>n</th><th>Win Rate</th><th>Avg R</th><th>Expectancy</th>
      </tr>
    </thead>
    <tbody>
    ${triggerGroups.map(g => {
      const agg = g.trades.filter(t => t.entryExecutionStyle === "Aggressive");
      const con = g.trades.filter(t => t.entryExecutionStyle === "Conservative");
      const unc = g.trades.filter(t => !t.entryExecutionStyle).length;
      return `<tr>
        <td style="white-space:normal;">${esc(g.key)}</td>
        ${cell(agg)}
        ${cell(con)}
        <td>${unc}</td>
      </tr>`;
    }).join("")}
    </tbody>
  </table>`;
}

function renderMatrixResults() {
  const area = document.getElementById("matrixResults");
  if (!area) return;
  if (!edgeMatrixDims.length) { area.innerHTML = '<div class="hint">Select 1–3 dimensions above.</div>'; return; }
  const matrixTrades = analyticsAccountId ? TRADES.filter(t => t.accountId === analyticsAccountId) : TRADES;

  // Special handling when "poi" (multi-select) is among the chosen dimensions:
  // explode across POIs so combinations are preserved without flattening.
  const hasPoi = edgeMatrixDims.includes("poi");
  const otherDims = edgeMatrixDims.filter(d => d !== "poi");

  let groups;
  if (hasPoi) {
    const map = new Map();
    matrixTrades.forEach(t => {
      const ids = (t.c2Intraday && Array.isArray(t.c2Intraday.whichPOI)) ? t.c2Intraday.whichPOI : [];
      if (!ids.length) return;
      const otherKey = otherDims.map(d => DIMENSIONS[d].fn(t) || "—").join(" × ");
      ids.forEach(id => {
        const k = (otherDims.length ? otherKey + " × " : "") + "POI:" + poiLabel(t, id);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(t);
      });
    });
    groups = [];
    map.forEach((list, key) => groups.push({ key, trades: list, stats: computeAggregateStats(list), sample: sampleSizeLabel(list.length) }));
    groups.sort((a, b) => b.stats.expectancy - a.stats.expectancy);
  } else {
    const keyFn = t => edgeMatrixDims.map(d => DIMENSIONS[d].fn(t) || "—").join(" × ");
    groups = groupTrades(matrixTrades, keyFn).sort((a, b) => b.stats.expectancy - a.stats.expectancy);
  }

  if (!groups.length) { area.innerHTML = '<div class="empty-state">No matching data yet.</div>'; return; }
  area.innerHTML = groups.map(g => {
    const isUseful = g.trades.length >= 30;
    return `
    <div class="card" style="margin-bottom:10px;background:var(--bg-2);">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div>
          <div style="font-size:12.5px;color:${isUseful ? 'var(--accent)' : 'var(--text-faint)'};font-weight:600;">${isUseful ? 'Potential Edge Detected' : 'Insufficient sample'}</div>
          <div style="font-family:var(--mono);font-size:14px;margin-top:3px;">${esc(g.key)}</div>
        </div>
        <span class="sample-tag ${g.sample.cls}">Sample Size: ${g.trades.length} · ${g.sample.label}</span>
      </div>
      <div class="grid grid-4" style="margin-top:10px;">
        <div class="kv"><span class="k">Win Rate</span><span class="v">${fmtPct(g.stats.winRate)}</span></div>
        <div class="kv"><span class="k">Expectancy</span><span class="v ${g.stats.expectancy>=0?'pos':'neg'}">${fmtR(g.stats.expectancy)}</span></div>
        <div class="kv"><span class="k">Profit Factor</span><span class="v">${fmtPF(g.stats.profitFactor)}</span></div>
        <div class="kv"><span class="k">Avg Execution</span><span class="v">${fmtNum(g.stats.avgExecution,1)}</span></div>
      </div>
    </div>`;
  }).join("");
}
/* ---------------------------------------------------------------------
   12. REVIEW (weekly / periodic)
   ---------------------------------------------------------------------
   Preserved. Best/worst breakdowns use DIMENSIONS, which already resolve
   framework labels across versions and for legacy trades.
   --------------------------------------------------------------------- */
let reviewAccountId = "";
function renderReview(main) {
  const scoped = reviewAccountId ? TRADES.filter(t => t.accountId === reviewAccountId) : TRADES;

  // Build week buckets (ISO week start Monday)
  function weekKey(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const day = (d.getDay() + 6) % 7; // Mon=0
    d.setDate(d.getDate() - day);
    return d.toISOString().slice(0, 10);
  }
  const weeks = groupTrades(scoped, t => weekKey(t.date));
  weeks.sort((a, b) => b.key.localeCompare(a.key));

  const bestBias = [...groupTrades(scoped, DIMENSIONS.bias.fn)].sort((a, b) => b.stats.expectancy - a.stats.expectancy)[0];
  const worstBias = [...groupTrades(scoped, DIMENSIONS.bias.fn)].sort((a, b) => a.stats.expectancy - b.stats.expectancy)[0];
  const bestTrigger = [...groupTrades(scoped, DIMENSIONS.trigger.fn)].sort((a, b) => b.stats.expectancy - a.stats.expectancy)[0];

  main.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
      <div>
        <h1 class="page-title">Review</h1>
        <p class="page-sub">Periodic reflection — process over outcome.</p>
      </div>
      <div class="field" style="min-width:190px;margin-bottom:0;">
        <label>Account</label>
        <select id="reviewAccountFilter">
          <option value="">All Accounts</option>
          ${ACCOUNTS.map(a => `<option value="${a.id}" ${reviewAccountId===a.id?'selected':''}>${esc(a.name)}${a.archived?' (archived)':''}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="grid grid-3">
      <div class="card"><div class="stat-label">Best Bias (by expectancy)</div><div style="font-family:var(--mono);margin-top:6px;">${bestBias ? esc(bestBias.key) + " · " + fmtR(bestBias.stats.expectancy) : "—"}</div></div>
      <div class="card"><div class="stat-label">Weakest Bias</div><div style="font-family:var(--mono);margin-top:6px;">${worstBias ? esc(worstBias.key) + " · " + fmtR(worstBias.stats.expectancy) : "—"}</div></div>
      <div class="card"><div class="stat-label">Best Trigger</div><div style="font-family:var(--mono);margin-top:6px;">${bestTrigger ? esc(bestTrigger.key) + " · " + fmtR(bestTrigger.stats.expectancy) : "—"}</div></div>
    </div>

    <div class="section-title">Weekly Breakdown</div>
    <div class="card" style="padding:0;overflow-x:auto;">
      ${weeks.length === 0 ? '<div class="empty-state">No trades to review yet.</div>' : `
      <table>
        <thead><tr><th>Week of</th><th>Trades</th><th>Win Rate</th><th>Net R</th><th>Expectancy</th><th>Avg Execution</th><th>Framework Compliance</th></tr></thead>
        <tbody>
        ${weeks.map(w => `
          <tr>
            <td>${esc(w.key)}</td>
            <td>${w.trades.length}</td>
            <td>${fmtPct(w.stats.winRate)}</td>
            <td class="${w.stats.netR>=0?'pos':'neg'}">${fmtR(w.stats.netR)}</td>
            <td class="${w.stats.expectancy>=0?'pos':'neg'}">${fmtR(w.stats.expectancy)}</td>
            <td>${fmtNum(w.stats.avgExecution,1)}</td>
            <td>${fmtPct(w.stats.frameworkCompliance)}</td>
          </tr>`).join("")}
        </tbody>
      </table>`}
    </div>

    <div class="section-title">Reflection Prompts</div>
    <div class="card">
      <ul style="margin:0;padding-left:18px;color:var(--text-dim);font-size:13px;line-height:1.9;">
        <li>Did I follow my process regardless of outcome?</li>
        <li>Which mistakes repeated this period?</li>
        <li>Where was my execution weakest (context / framework / entry / risk / management)?</li>
        <li>Did any emotional state precede my worst trades?</li>
        <li>What single adjustment would most improve next period?</li>
      </ul>
    </div>
  `;
  document.getElementById("reviewAccountFilter").onchange = e => { reviewAccountId = e.target.value; renderReview(main); };
}

function openPlaybookEditor(id) {
  const p = id ? JSON.parse(JSON.stringify(PLAYBOOKS.find(x => x.id === id))) : { id: "pb_" + uuid(), name: "", bias: "", trigger: "", session: "", description: "", conditions: [], createdAt: new Date().toISOString() };
  const root = document.getElementById("modal-root");
  const biasNames = activeConfig().biasModels.map(m => m.name);
  const triggerNames = activeConfig().triggerSessions.map(s => s.name);
  root.innerHTML = `
    <div class="modal-backdrop" id="pbBackdrop">
      <div class="modal">
        <div class="modal-head"><h2>${id ? "Edit" : "New"} Setup</h2><button class="close-x" id="pbClose">&times;</button></div>

        <div class="grid grid-3">

          <div class="field"><label>Trigger</label><select id="pb_trigger"><option value=""></option>${triggerNames.map(tr => `<option ${p.trigger===tr?'selected':''}>${esc(tr)}</option>`).join("")}</select></div>
          <div class="field"><label>Session</label><select id="pb_session"><option value=""></option>${SESSIONS.map(s => `<option ${p.session===s?'selected':''}>${s}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label>Description</label><textarea id="pb_desc">${esc(p.description)}</textarea></div>
        <div class="field"><label>Entry Conditions (one per line)</label><textarea id="pb_conditions">${esc((p.conditions||[]).join("\n"))}</textarea></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;"><button class="btn" id="pbCancel">Cancel</button><button class="btn primary" id="pbSave">Save Setup</button></div>
      </div>
    </div>
  `;
  const close = () => root.innerHTML = "";
  document.getElementById("pbClose").onclick = close;
  document.getElementById("pbCancel").onclick = close;

    p.name = document.getElementById("pb_name").value.trim() || "Untitled Setup";
    p.bias = document.getElementById("pb_bias").value;
    p.trigger = document.getElementById("pb_trigger").value;
    p.session = document.getElementById("pb_session").value;
    p.description = document.getElementById("pb_desc").value;

    if (idx >= 0) PLAYBOOKS[idx] = p; else PLAYBOOKS.push(p);
    close(); renderPlaybookList(); toast("Setup saved.");

}

/* ---- IMPORT (merge by id; no duplicate entities) ---- */
async function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const resultEl = document.getElementById("importResult");
  try {
    const text = await readFileAsText(file);
    const data = JSON.parse(text);
    let added = { trades: 0, accounts: 0, playbook: 0, reviews: 0, versions: 0 };

    // Framework versions first, so imported trades can reference them.
    if (data.framework && Array.isArray(data.framework.versions)) {
      for (const v of data.framework.versions) {
        if (!v || !v.id) continue;
        if (!FRAMEWORK_VERSIONS.some(x => x.id === v.id)) {
          await idbPut("framework", v);
          FRAMEWORK_VERSIONS.push(v);
          added.versions++;
        }
      }
      // Adopt imported active pointer only if we currently have none.
      if (!ACTIVE_FRAMEWORK && data.framework.activeVersionId) {
        const av = frameworkVersionById(data.framework.activeVersionId);
        if (av) { ACTIVE_FRAMEWORK = av; SETTINGS.activeFrameworkVersionId = av.id; await idbPut("kv", SETTINGS); }
      }
    }

    if (Array.isArray(data.accounts)) {
      for (const a of data.accounts) {
        if (!a || !a.id) continue;
        if (!ACCOUNTS.some(x => x.id === a.id)) { await idbPut("accounts", a); ACCOUNTS.push(a); added.accounts++; }
      }
    }
    if (Array.isArray(data.trades)) {
      for (const t of data.trades) {
        if (!t || !t.tradeId) continue;
        if (!TRADES.some(x => x.tradeId === t.tradeId)) {
          const shaped = migrateTradeShape(t);
          await idbPut("trades", shaped); TRADES.push(shaped); added.trades++;
        }
      }
    }
    if (Array.isArray(data.playbook)) {
      for (const p of data.playbook) {
        if (!p || !p.id) continue;
        if (!PLAYBOOKS.some(x => x.id === p.id)) { await idbPut("playbook", p); PLAYBOOKS.push(p); added.playbook++; }
      }
    }
    if (Array.isArray(data.weeklyReviews)) {
      for (const r of data.weeklyReviews) {
        if (!r || !r.id) continue;
        if (!REVIEWS.some(x => x.id === r.id)) { await idbPut("weeklyReviews", r); REVIEWS.push(r); added.reviews++; }
      }
    }
    resultEl.innerHTML = `<div class="hint" style="color:var(--green);">Imported — ${added.trades} trades, ${added.accounts} accounts, ${added.playbook} setups, ${added.reviews} reviews, ${added.versions} framework versions (duplicates skipped).</div>`;
    toast("Import complete.");
  } catch (err) {
    resultEl.innerHTML = `<div class="hint" style="color:var(--red);">Import failed: ${esc(err.message)}</div>`;
  }
}
/* ---------------------------------------------------------------------
   14b. FRAMEWORK CONFIGURATION EDITOR  (NEW — LAYER 1 management UI)
   ---------------------------------------------------------------------
   Lets the trader manage the framework without touching code:
     - Bias Models (+ their checklists)
     - C2 Intraday POI options (multi-select source)
     - C2 Intraday TF options, Scenario options
     - Trigger (Entry) Sessions (+ their checklists)
     - Version lifecycle: edit a Draft, Publish it (becomes active for new
       trades), Lock it (immutable). Historical trades always keep the
       version they were recorded under.

   Editing rules:
     - Published/Locked versions are read-only. To change the framework you
       create a Draft (copied from the active config), edit it, then Publish.
     - Every entity keeps its STABLE id across edits, so historical trades
       keep resolving correctly. Removing/disabling an option never rewrites
       old trades — removed options still display via the label helpers.
   --------------------------------------------------------------------- */
let fwEditorDraftId = null; // id of the draft version currently being edited (if any)

function getDraftVersion() {
  return FRAMEWORK_VERSIONS.find(v => v.status === "draft") || null;
}

function renderFrameworkEditor(body) {
  const draft = getDraftVersion();
  const active = ACTIVE_FRAMEWORK;
  body.innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-top:0;">Framework Versions</div>
      <p class="hint">New trades use the <b>active</b> (published) version. Historical trades always keep the version they were recorded under. Edit by creating a Draft, then Publish it.</p>
      <div id="fwVersionsList"></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
        ${draft ? "" : `<button class="btn primary" id="fwNewDraft">Create Draft from Active</button>`}
        ${draft ? `<button class="btn primary" id="fwPublishDraft">Publish Draft V${esc(draft.version)}</button>` : ""}
        ${draft ? `<button class="btn danger" id="fwDiscardDraft">Discard Draft</button>` : ""}
      </div>
    </div>
    <div id="fwEditArea" style="margin-top:14px;"></div>
  `;

  const list = document.getElementById("fwVersionsList");
  const sorted = [...FRAMEWORK_VERSIONS].sort((a, b) => String(b.version).localeCompare(String(a.version), undefined, { numeric: true }));
  list.innerHTML = sorted.length ? sorted.map(v => {
    const isActive = ACTIVE_FRAMEWORK && v.id === ACTIVE_FRAMEWORK.id;
    const pill = v.status === "draft" ? '<span class="pill draft">DRAFT</span>' : (v.status === "locked" ? '<span class="pill locked">LOCKED</span>' : '<span class="pill ver">PUBLISHED</span>');
    const usedCount = TRADES.filter(t => t.frameworkVersionId === v.id).length;
    return `<div class="fw-cfg-item">
      <div class="grow"><span class="lbl">V${esc(v.version)}</span> ${pill} ${isActive ? '<span class="pill req">ACTIVE</span>' : ''}
        <div class="meta">${usedCount} trade(s) · created ${esc((v.createdAt||'').slice(0,10))}</div></div>
      ${v.status === "draft" ? `<button class="btn sm" data-editver="${v.id}">Edit</button>` : ""}
      ${v.status === "published" && !isActive ? `<button class="btn sm" data-activate="${v.id}">Set Active</button>` : ""}
      ${v.status === "published" ? `<button class="btn sm" data-lock="${v.id}">Lock</button>` : ""}
    </div>`;
  }).join("") : '<div class="hint">No versions yet.</div>';

  const newDraftBtn = document.getElementById("fwNewDraft");
  if (newDraftBtn) newDraftBtn.onclick = async () => {
    const base = ACTIVE_FRAMEWORK ? ACTIVE_FRAMEWORK.config : seedFrameworkConfig();
    const nextVer = nextDraftVersionNumber();
    const draftV = makeFrameworkVersion(nextVer, "draft", JSON.parse(JSON.stringify(base)));
    await idbPut("framework", draftV);
    FRAMEWORK_VERSIONS.push(draftV);
    fwEditorDraftId = draftV.id;
    renderFrameworkEditor(body);
  };
  const publishBtn = document.getElementById("fwPublishDraft");
  if (publishBtn) publishBtn.onclick = async () => {
    if (!confirm("Publish this draft? It becomes the active framework for NEW trades. Existing trades are unaffected.")) return;
    draft.status = "published";
    draft.publishedAt = new Date().toISOString();
    await idbPut("framework", draft);
    ACTIVE_FRAMEWORK = draft;
    SETTINGS.activeFrameworkVersionId = draft.id;
    await idbPut("kv", SETTINGS);
    fwEditorDraftId = null;
    renderFrameworkEditor(body);
    toast("Draft published and set active.");
  };
  const discardBtn = document.getElementById("fwDiscardDraft");
  if (discardBtn) discardBtn.onclick = async () => {
    if (!confirm("Discard this draft? Its unpublished changes are lost.")) return;
    await idbDelete("framework", draft.id);
    FRAMEWORK_VERSIONS = FRAMEWORK_VERSIONS.filter(v => v.id !== draft.id);
    fwEditorDraftId = null;
    renderFrameworkEditor(body);
    toast("Draft discarded.");
  };
  list.querySelectorAll("[data-editver]").forEach(b => b.onclick = () => { fwEditorDraftId = b.dataset.editver; renderFrameworkEditor(body); });
  list.querySelectorAll("[data-activate]").forEach(b => b.onclick = async () => {
    const v = frameworkVersionById(b.dataset.activate);
    if (!v) return;
    ACTIVE_FRAMEWORK = v; SETTINGS.activeFrameworkVersionId = v.id; await idbPut("kv", SETTINGS);
    renderFrameworkEditor(body); toast("Active version updated.");
  });
  list.querySelectorAll("[data-lock]").forEach(b => b.onclick = async () => {
    const v = frameworkVersionById(b.dataset.lock);
    if (!v) return;
    if (!confirm("Lock V" + v.version + "? It becomes permanently read-only.")) return;
    v.status = "locked"; await idbPut("framework", v);
    renderFrameworkEditor(body); toast("Version locked.");
  });

  // If a draft is being edited, show the editing surface.
  const editArea = document.getElementById("fwEditArea");
  const editingDraft = fwEditorDraftId ? frameworkVersionById(fwEditorDraftId) : (draft || null);
  if (editingDraft && editingDraft.status === "draft") {
    renderDraftEditor(editArea, editingDraft, body);
  } else {
    editArea.innerHTML = `<div class="card"><div class="hint">Select or create a Draft to edit the framework. The active configuration is shown read-only below.</div>
      <div style="margin-top:10px;">${renderConfigReadonly(active ? active.config : seedFrameworkConfig())}</div></div>`;
  }
}

function nextDraftVersionNumber() {
  // Simple bump: max integer major + 1 decimal step. Uses X.Y numbering.
  let maxMajor = 1, maxMinor = 0;
  FRAMEWORK_VERSIONS.forEach(v => {
    const parts = String(v.version).split(".");
    const maj = parseInt(parts[0], 10) || 1;
    const min = parseInt(parts[1], 10) || 0;
    if (maj > maxMajor || (maj === maxMajor && min > maxMinor)) { maxMajor = maj; maxMinor = min; }
  });
  return maxMajor + "." + (maxMinor + 1);
}

function renderConfigReadonly(config) {
  const modelLines = config.biasModels.map(m => `${esc(m.name)}${m.enabled ? "" : " (disabled)"} — ${enabledChecklist(m).length} item(s)`).join("<br>");

  const scn = config.c2Intraday.scenarios.filter(o => o.enabled).map(o => esc(o.label)).join(", ");
  const sess = config.triggerSessions.map(s => `${esc(s.name)}${s.enabled ? "" : " (disabled)"} — ${enabledChecklist(s).length} item(s)`).join("<br>");
  return `
    <div class="kv"><span class="k">Bias Models</span></div><div class="meta" style="margin-bottom:8px;">${modelLines}</div>
    <div class="kv"><span class="k">POI options</span><span class="v" style="white-space:normal;text-align:right;">${poi||'—'}</span></div>
    <div class="kv"><span class="k">TF options</span><span class="v" style="white-space:normal;text-align:right;">${tf||'—'}</span></div>
    <div class="kv"><span class="k">Scenarios</span><span class="v" style="white-space:normal;text-align:right;">${scn||'—'}</span></div>
    <div class="kv"><span class="k">Trigger Sessions</span></div><div class="meta">${sess}</div>
  `;
}

let fwEditSection = "bias";
function renderDraftEditor(area, draftV, rootBody) {
  const cfg = draftV.config;
  area.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="section-title" style="margin:0;">Editing Draft V${esc(draftV.version)} <span class="pill draft">DRAFT</span></div>
      </div>
      <div class="tabs" style="margin-top:10px;">
        ${[["bias","Bias Models"],["poi","POI"],["tf","TF"],["scenario","Scenario"],["trigger","Trigger Sessions"]]
          .map(([k,l]) => `<div class="tab ${fwEditSection===k?'active':''}" data-sec="${k}">${l}</div>`).join("")}
      </div>
      <div id="fwSectionBody"></div>
    </div>
  `;
  area.querySelectorAll(".tab[data-sec]").forEach(t => t.onclick = () => { fwEditSection = t.dataset.sec; renderDraftEditor(area, draftV, rootBody); });
  const sb = document.getElementById("fwSectionBody");
  const persist = async () => { await idbPut("framework", draftV); };
  const rerender = () => renderDraftEditor(area, draftV, rootBody);

  if (fwEditSection === "bias") renderBiasEditor(sb, cfg, persist, rerender);
  else if (fwEditSection === "poi") renderOptionListEditor(sb, cfg.c2Intraday.poiOptions, "POI option", persist, rerender, "poi");
  else if (fwEditSection === "tf") renderOptionListEditor(sb, cfg.c2Intraday.tfOptions, "TF option", persist, rerender, "tf");
  else if (fwEditSection === "scenario") renderOptionListEditor(sb, cfg.c2Intraday.scenarios, "Scenario", persist, rerender, "scn");
  else if (fwEditSection === "trigger") renderSessionEditor(sb, cfg, persist, rerender);
}

/* Generic option list editor (POI / TF / Scenario): add, rename, enable/disable, reorder, remove */
function renderOptionListEditor(container, arr, label, persist, rerender, idPrefix) {
  const sorted = arr.slice().sort(_byOrder);
  container.innerHTML = `
    <p class="hint">${esc(label)} options. Disable to hide from new trades while keeping old trades intact. Order controls display order.</p>
    <div id="optList">
      ${sorted.map(o => `
        <div class="fw-cfg-item ${o.enabled ? "" : "disabled"}">
          <div class="ord-btns"><button data-up="${esc(o.id)}">▲</button><button data-down="${esc(o.id)}">▼</button></div>
          <div class="grow"><input type="text" data-name="${esc(o.id)}" value="${esc(o.label)}" style="margin-bottom:2px;"><div class="meta">${esc(o.id)}</div></div>
          <button class="btn sm" data-toggle="${esc(o.id)}">${o.enabled ? "Disable" : "Enable"}</button>
          <button class="btn sm danger" data-remove="${esc(o.id)}">Remove</button>
        </div>`).join("")}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <input type="text" id="newOptLabel" placeholder="New ${esc(label)} label...">
      <button class="btn primary" id="addOpt">Add</button>
    </div>
  `;
  container.querySelectorAll("[data-name]").forEach(inp => inp.onchange = async () => {
    const o = arr.find(x => x.id === inp.dataset.name); if (o) { o.label = inp.value; await persist(); }
  });
  container.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
    const o = arr.find(x => x.id === b.dataset.toggle); if (o) { o.enabled = !o.enabled; await persist(); rerender(); }
  });
  container.querySelectorAll("[data-remove]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this option? Historical trades that used it still display it correctly.")) return;
    const idx = arr.findIndex(x => x.id === b.dataset.remove); if (idx >= 0) { arr.splice(idx, 1); await persist(); rerender(); }
  });
  container.querySelectorAll("[data-up]").forEach(b => b.onclick = async () => { reorderById(arr, b.dataset.up, -1); await persist(); rerender(); });
  container.querySelectorAll("[data-down]").forEach(b => b.onclick = async () => { reorderById(arr, b.dataset.down, +1); await persist(); rerender(); });
  container.querySelector("#addOpt").onclick = async () => {
    const val = container.querySelector("#newOptLabel").value.trim();
    if (!val) return;
    const maxOrder = arr.reduce((m, o) => Math.max(m, o.order || 0), 0);
    arr.push({ id: idPrefix + "_" + uuid().slice(0, 8), label: val, enabled: true, order: maxOrder + 1 });
    await persist(); rerender();
  };
}

function reorderById(arr, id, dir) {
  const sorted = arr.slice().sort(_byOrder);
  const i = sorted.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sorted.length) return;
  const a = sorted[i], b = sorted[j];
  const tmp = a.order; a.order = b.order; b.order = tmp;
}

/* Checklist editor shared by bias models and sessions */
function renderChecklistEditor(container, parent, persist, rerender) {
  const items = (parent.checklist || []).slice().sort(_byOrder);
  container.innerHTML = `
    <div style="border:1px dashed var(--border);border-radius:var(--radius);padding:10px;margin-top:8px;">
      <div class="meta" style="margin-bottom:6px;">Checklist items — required items must all be checked for the model/session to be "confirmed".</div>
      ${items.map(c => `
        <div class="fw-cfg-item ${c.enabled ? "" : "disabled"}">
          <div class="ord-btns"><button data-cup="${esc(c.id)}">▲</button><button data-cdown="${esc(c.id)}">▼</button></div>
          <div class="grow"><input type="text" data-clabel="${esc(c.id)}" value="${esc(c.label)}"><div class="meta">${esc(c.id)}</div></div>
          <label class="meta" style="display:flex;align-items:center;gap:4px;"><input type="checkbox" data-creq="${esc(c.id)}" ${c.required ? "checked" : ""}> req</label>
          <button class="btn sm" data-ctoggle="${esc(c.id)}">${c.enabled ? "Disable" : "Enable"}</button>
          <button class="btn sm danger" data-cremove="${esc(c.id)}">✕</button>
        </div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="text" data-newitem placeholder="New checklist item...">
        <button class="btn sm primary" data-additem>Add Item</button>
      </div>
    </div>
  `;
  container.querySelectorAll("[data-clabel]").forEach(inp => inp.onchange = async () => { const c = parent.checklist.find(x => x.id === inp.dataset.clabel); if (c) { c.label = inp.value; await persist(); } });
  container.querySelectorAll("[data-creq]").forEach(cb => cb.onchange = async () => { const c = parent.checklist.find(x => x.id === cb.dataset.creq); if (c) { c.required = cb.checked; await persist(); } });
  container.querySelectorAll("[data-ctoggle]").forEach(b => b.onclick = async () => { const c = parent.checklist.find(x => x.id === b.dataset.ctoggle); if (c) { c.enabled = !c.enabled; await persist(); reopenChecklist(container, parent, persist, rerender); } });
  container.querySelectorAll("[data-cremove]").forEach(b => b.onclick = async () => { const idx = parent.checklist.findIndex(x => x.id === b.dataset.cremove); if (idx >= 0) { parent.checklist.splice(idx, 1); await persist(); reopenChecklist(container, parent, persist, rerender); } });
  container.querySelectorAll("[data-cup]").forEach(b => b.onclick = async () => { reorderById(parent.checklist, b.dataset.cup, -1); await persist(); reopenChecklist(container, parent, persist, rerender); });
  container.querySelectorAll("[data-cdown]").forEach(b => b.onclick = async () => { reorderById(parent.checklist, b.dataset.cdown, +1); await persist(); reopenChecklist(container, parent, persist, rerender); });
  container.querySelector("[data-additem]").onclick = async () => {
    const inp = container.querySelector("[data-newitem]");
    const val = inp.value.trim(); if (!val) return;
    if (!parent.checklist) parent.checklist = [];
    const maxOrder = parent.checklist.reduce((m, c) => Math.max(m, c.order || 0), 0);
    parent.checklist.push({ id: "chk_" + uuid().slice(0, 8), label: val, enabled: true, required: true, order: maxOrder + 1 });
    await persist(); reopenChecklist(container, parent, persist, rerender);
  };
}
function reopenChecklist(container, parent, persist, rerender) {
  renderChecklistEditor(container, parent, persist, rerender);
}
