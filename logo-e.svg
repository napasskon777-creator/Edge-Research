<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- พื้นหลังสีดำ มุมโค้ง -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#0B0B0C"/>

  <!-- ตัวอักษร E ทรงเรขาคณิต ตัดเฉียงปลายแขนให้ดูมีมิติ/เท่ -->
  <g fill="#FFFFFF">
    <!-- แกนตั้ง -->
    <rect x="27" y="21" width="12" height="58" />
    <!-- แขนบน (เฉียงปลาย) -->
    <polygon points="27,21 76,21 65,34 27,34" />
    <!-- แขนกลาง (สั้นกว่า) -->
    <polygon points="27,44 62,44 53,57 27,57" />
    <!-- แขนล่าง (เฉียงปลาย) -->
    <polygon points="27,66 76,66 65,79 27,79" />
  </g>
</svg>
